<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2CC1">
<title>Indiegym</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B2CC1'/%3E%3Cg fill='white'%3E%3Crect x='3' y='12' width='3' height='8' rx='1'/%3E%3Crect x='7' y='9' width='3' height='14' rx='1'/%3E%3Crect x='10' y='14.5' width='12' height='3'/%3E%3Crect x='22' y='9' width='3' height='14' rx='1'/%3E%3Crect x='26' y='12' width='3' height='8' rx='1'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --slab:#1B2CC1;      /* ultramarine: identity colour */
  --ink:#101A4A;       /* deep navy text */
  --muted:#565D7E;
  --floor:#E3E5E9;     /* concrete */
  --paper:#FFFFFF;
  --line:#C9CDD6;
  --signal:#FF5B1F;    /* safety orange: attention only */
  --danger:#B3200C;
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--floor);color:var(--ink);font:16px/1.45 var(--font-body);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Top bar ---------- */
.top{background:var(--slab);color:#fff;position:sticky;top:0;z-index:30}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1;letter-spacing:.01em}
.brand svg{width:30px;height:30px;fill:currentColor}
.keychip{border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:0 14px;min-height:38px;font-size:13px;font-weight:600;cursor:pointer}
.keychip.none,.keychip.bad{background:var(--signal);border-color:var(--signal);color:var(--ink)}
.keychip.ok::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#7CF2A6;margin-right:8px}

/* ---------- Tabs (bottom bar on phones, inline on desktop) ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-top:1.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;border:0;background:none;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--slab);box-shadow:inset 0 3px 0 var(--slab)}

/* ---------- Layout ---------- */
main{max-width:1120px;margin:0 auto;padding:0 16px 32px}
.keybar{margin:14px 0 0;padding:12px 14px;background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.keybar p{max-width:56ch;font-size:14.5px}

/* Day rail */
.rail{position:relative;display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:2px 16px 10px;scroll-snap-type:x proximity;scroll-padding-left:16px}
.dchip{flex:0 0 auto;width:136px;text-align:left;background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;padding:9px 11px 10px;cursor:pointer;scroll-snap-align:start}
.dchip b{display:block;font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1}
.dchip span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.3;color:var(--muted);margin-top:4px;min-height:2.6em}
.dchip.on{background:var(--slab);border-color:var(--slab);color:#fff}
.dchip.on span{color:#DDE1FF}
.dchip.add{background:transparent;border-style:dashed;width:96px}

/* Day header */
.day-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:14px 0 14px;flex-wrap:wrap}
.day-head h2{font-family:var(--font-display);font-weight:800;font-size:clamp(36px,8vw,56px);line-height:.95}
.day-head .meta{color:var(--muted);font-size:14px;margin-top:8px}
.day-tools{display:flex;gap:2px;margin-left:-10px}
.link{background:none;border:0;padding:0 10px;min-height:40px;font-weight:600;font-size:14px;color:var(--slab);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--danger)}

/* Exercise rows */
.ex-list{border-top:2px solid var(--ink)}
.ex{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ex:hover{background:rgba(255,255,255,.5)}
.ex .gif{width:132px}
.ex-main h3{font-size:17px;line-height:1.25;font-weight:700}
.ex-muscle{color:var(--muted);font-size:13px;margin-top:2px}
.ex-stats{display:flex;gap:20px;margin-top:10px}
.ex-stats b{display:block;font-family:var(--font-display);font-weight:700;font-size:23px;line-height:1.05}
.ex-stats span{font-size:12px;color:var(--muted)}
.pips{display:inline-flex;align-items:center;gap:4px;margin-top:10px}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink)}
.pips i.on{background:var(--ink)}
.pips em{font-style:normal;font-size:12.5px;color:var(--muted);margin-left:6px}
.add-ex{margin-top:18px}

/* GIF slots */
.gif{position:relative;aspect-ratio:1/1;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.gif img{width:100%;height:100%;object-fit:contain;display:block}
.gif.loading{background:linear-gradient(100deg,#fff 30%,#EDEFF5 50%,#fff 70%) 0 0/220% 100%;animation:sheen 1.3s linear infinite}
@keyframes sheen{to{background-position:-220% 0}}
.gif.err,.gif.empty{background:#F3F4F7}
.gif.lg{aspect-ratio:auto;width:100%;height:min(50vh,340px)}
.gif.sm{width:56px;flex:0 0 56px}
.gif-msg{font-size:12px;line-height:1.25;color:var(--muted);padding:0 8px}
.gif-btn{border:1.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:0 12px;min-height:32px;font-size:12px;font-weight:700;cursor:pointer}
.gif.sm .gif-msg{display:none}
.gif.sm .gif-btn{font-size:10px;padding:0 6px;min-height:22px}

/* Library */
.lib-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:20px 0 12px}
.lib-head h2{font-family:var(--font-display);font-weight:800;font-size:clamp(36px,8vw,52px);line-height:.95}
.lib-head p{color:var(--muted);font-size:14px}
.search input{width:100%;min-height:48px;border:1.5px solid var(--ink);border-radius:8px;padding:0 14px;background:var(--paper);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:2px 16px 8px}
.gchip{flex:0 0 auto;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font-weight:600;font-size:14px;cursor:pointer}
.gchip.on{background:var(--ink);color:#fff}
.lib-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px;margin-top:10px}
.tile{cursor:pointer;display:flex;flex-direction:column;gap:7px}
.tile .gif{width:100%}
.tile-name{display:block;font-weight:700;font-size:14px;line-height:1.25}
.tile-meta{display:block;font-size:12.5px;color:var(--muted);margin-top:-4px}
.empty{grid-column:1/-1;color:var(--muted);padding:24px 0}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(16,26,74,.62);display:none;z-index:60;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--paper);width:100%;max-width:600px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.4}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet-head h3{font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1.02}
.x{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);font-size:24px;line-height:1;cursor:pointer}
.sheet .gif.lg{margin-bottom:12px}
.sheet h4{font-size:15px;font-weight:700;margin:16px 0 6px}
.how{white-space:pre-line;font-size:15.5px;line-height:1.55;max-width:62ch}
.set{padding:16px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0;padding-top:0}
.set h4{margin-top:0}

/* Forms and buttons */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;font-size:16px}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--slab);outline:none;box-shadow:0 0 0 3px rgba(27,44,193,.18)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;min-width:0;width:auto}
.hint{font-size:13.5px;color:var(--muted)}
.hint a{color:var(--slab);font-weight:600}
.status{font-size:13.5px;margin-top:10px;min-height:1.4em}
.status.ok{color:#0F6B3A}
.status.err{color:var(--danger)}
.btn{min-height:46px;padding:0 18px;border-radius:8px;border:1.5px solid var(--ink);background:var(--paper);font-weight:700;cursor:pointer}
.btn.primary{background:var(--slab);border-color:var(--slab);color:#fff}
.btn.signal{background:var(--signal);border-color:var(--signal);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.wide{width:100%}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
details.jefit{margin:0 0 14px;border:1.5px solid var(--line);border-radius:8px;padding:0 12px}
details.jefit summary{min-height:46px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details.jefit[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details.jefit .keyrow{margin-bottom:0}
details.jefit .hint{margin:8px 0 12px}
.pick-list{border:1.5px solid var(--line);border-radius:8px;margin-top:8px;max-height:270px;overflow:auto}
.pick{display:flex;gap:12px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.pick:last-child{border-bottom:0}
.pick:hover{background:#F3F4F7}
.pick b{display:block;font-size:14.5px}
.pick small{display:block;color:var(--muted);font-size:12.5px}
.preview{display:flex;gap:12px;align-items:center;margin-top:10px}
.preview .gif{width:120px;flex:0 0 120px}
.check{display:flex;gap:10px;align-items:center;margin:4px 0 0;font-size:14.5px}
.check input{width:20px;height:20px;min-height:0;accent-color:var(--slab)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;z-index:80;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* ---------- Wider screens ---------- */
@media(min-width:620px){
  .lib-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(min-width:820px){
  body{padding-bottom:0}
  main{padding:0 24px 56px}
  .top-in{padding:12px 24px}
  .tabs{position:static;display:flex;gap:4px;background:none;border:0;padding:0}
  .tab{flex-direction:row;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;color:#DDE1FF;font-size:14px}
  .tab.on{background:#fff;color:var(--slab);box-shadow:none}
  .tab.settings-tab{display:none}
  .rail,.chips{margin-left:0;margin-right:0;padding-left:0;padding-right:0}
  .dchip{width:150px}
  .rail{scroll-padding-left:0}
  .day-tools{margin-left:0}
  .ex-list{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
  .ex{grid-template-columns:168px 1fr}
  .ex .gif{width:168px}
  .lib-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px}
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:14px;padding-bottom:24px}
  .toast{bottom:32px}
}
@media(min-width:1100px){
  .lib-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="11" width="4" height="10" rx="1"/><rect x="6.5" y="8" width="4" height="16" rx="1"/><rect x="10.5" y="14.5" width="11" height="3"/><rect x="21.5" y="8" width="4" height="16" rx="1"/><rect x="26" y="11" width="4" height="10" rx="1"/></svg>
      <span>Indiegym</span>

    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-act="tab" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>Plan</button>
      <button class="tab" data-act="tab" data-tab="lib"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Library</button>
      <button class="tab settings-tab" data-act="open-settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></svg>Key</button>
    </nav>
    <button class="keychip" id="keyChip" data-act="open-settings"></button>
  </div>
</header>

<main id="main"></main>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

   Helpers
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);

/* =========================================================
   GIF loading through corsproxy.io
   fetch -> blob -> saved in IndexedDB -> object URL -> <img>
   ========================================================= */
const proxyUrl = (target, key) => "https://corsproxy.io/?key=" + encodeURIComponent(key) + "&url=" + encodeURIComponent(target);

class GifError extends Error{ constructor(kind, msg){ super(msg); this.kind = kind; } }
const GIF = {mem: new Map(), pending: new Map(), dead: new Set(), keyBad: false, coolUntil: 0, active: 0, queue: [], MAX: 4};

function enqueue(task){
  return new Promise((resolve, reject) => { GIF.queue.push({task, resolve, reject}); pump(); });
}
function pump(){
  while(GIF.active < GIF.MAX && GIF.queue.length){
    const j = GIF.queue.shift();
    GIF.active++;
    j.task().then(j.resolve, j.reject).finally(() => { GIF.active--; pump(); });
  }
}

/* IndexedDB cache so each GIF is only fetched through the proxy once */
let dbPromise;
function openDb(){
  if(!dbPromise) dbPromise = new Promise((res, rej) => {
    try{
      const r = indexedDB.open("indiegym", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("gifs");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }catch(e){ rej(e); }
  });
  return dbPromise;
}
const dbReq = (mode, fn) => openDb().then(db => new Promise((res, rej) => {
  const q = fn(db.transaction("gifs", mode).objectStore("gifs"));
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error);
}));
const dbGet = k => dbReq("readonly", s => s.get(k)).then(v => v || null).catch(() => null);
const dbPut = (k, v) => dbReq("readwrite", s => s.put(v, k)).catch(() => {});
const dbCount = () => dbReq("readonly", s => s.count()).catch(() => 0);
const dbClear = () => dbReq("readwrite", s => s.clear()).catch(() => {});

function remember(url, blob){
  if(GIF.mem.has(url)) return GIF.mem.get(url);
  const o = URL.createObjectURL(blob);
  GIF.mem.set(url, o);
  return o;
}

async function fetchBlob(target, key){
  let res;
  try{ res = await fetch(proxyUrl(target, key)); }
  catch(e){ throw new GifError("network", "Could not reach corsproxy.io. Check your connection."); }

  if(!res.ok){
    const text = (await res.text().catch(() => "")).trim();
    const snippet = text.slice(0, 140);
    if((res.status === 401 || res.status === 402 || res.status === 403) && /api key/i.test(text)){
      GIF.keyBad = true;
      throw new GifError("key", "corsproxy.io rejected the key.");
    }
    if(res.status === 429){
      GIF.coolUntil = Date.now() + 30000;
      throw new GifError("rate", "corsproxy.io says you have hit a rate limit. Wait a moment, then retry.");
    }
    if(res.status === 404){
      GIF.dead.add(target);
      throw new GifError("missing", "No GIF found at this link (404).");
    }
    throw new GifError("http", "corsproxy.io returned " + res.status + (snippet ? ": " + snippet : "."));
  }

  let blob = await res.blob();
  if(!/^image\//.test(blob.type)){
    const head = await blob.slice(0, 6).text().catch(() => "");
    if(head.startsWith("GIF8")){
      blob = new Blob([blob], {type: "image/gif"});
    }else{
      const text = await blob.text().catch(() => "");
      if(/api key/i.test(text)){ GIF.keyBad = true; throw new GifError("key", "corsproxy.io rejected the key."); }
      throw new GifError("type", "The response was not an image.");
    }
  }
  return blob;
}

function loadGif(url){
  if(GIF.mem.has(url)) return Promise.resolve(GIF.mem.get(url));
  if(GIF.pending.has(url)) return GIF.pending.get(url);
  const p = (async () => {
    const hit = await dbGet(url);
    if(hit) return remember(url, hit);
    if(GIF.dead.has(url)) throw new GifError("missing", "No GIF found at this link.");
    const key = getKey();
    if(!key) throw new GifError("nokey", "Add your corsproxy.io key to load GIFs.");
    if(GIF.keyBad) throw new GifError("key", "corsproxy.io rejected the key.");
    if(Date.now() < GIF.coolUntil) throw new GifError("rate", "Rate limit reached. Wait a moment, then retry.");
    const blob = await enqueue(() => fetchBlob(url, key));
    dbPut(url, blob);
    return remember(url, blob);
  })();
  GIF.pending.set(url, p);
  p.then(() => GIF.pending.delete(url), () => GIF.pending.delete(url));
  return p;
}

/* GIF slot: an empty frame that fills with the fetched image */
function gifSlot(url, {size = "md", alt = ""} = {}){
  if(!url) return `<div class="gif ${size} empty"><span class="gif-msg">No GIF</span></div>`;
  return `<div class="gif ${size} loading" data-gif="${esc(url)}" data-alt="${esc(alt)}"></div>`;
}
function showImg(el, src){
  el.classList.remove("loading", "err");
  el.removeAttribute("title");
  const img = new Image();
  img.alt = (el.dataset.alt || "Exercise") + " demonstration";
  img.decoding = "async";
  img.src = src;
  el.replaceChildren(img);
}
const SHORT = {nokey:"Needs your key", key:"Key rejected", rate:"Rate limited", network:"Can’t reach proxy", missing:"GIF not found", type:"Not an image", http:"Couldn’t load"};
function showErr(el, e){
  const kind = e.kind || "http";
  el.classList.remove("loading");
  el.classList.add("err");
  el.title = e.message;
  const btn = (kind === "nokey" || kind === "key")
    ? `<button class="gif-btn" type="button" data-act="open-settings">${kind === "nokey" ? "Add key" : "Update key"}</button>`
    : kind === "missing" ? "" : `<button class="gif-btn" type="button" data-act="retry-gif">Retry</button>`;
  el.innerHTML = `<span class="gif-msg">${esc(SHORT[kind] || SHORT.http)}</span>${btn}`;
}
async function startSlot(el){
  const url = el.dataset.gif;
  el.classList.remove("err");
  el.classList.add("loading");
  el.replaceChildren();
  try{
    const src = await loadGif(url);
    if(el.isConnected && el.dataset.gif === url) showImg(el, src);
  }catch(e){
    if(el.isConnected) showErr(el, e);
  }
}
const io = "IntersectionObserver" in window
  ? new IntersectionObserver(entries => entries.forEach(en => {
      if(en.isIntersecting){ io.unobserve(en.target); startSlot(en.target); }
    }), {rootMargin: "300px"})
  : null;
function hydrate(root = document){
  root.querySelectorAll(".gif[data-gif]").forEach(el => {
    if(el.dataset.bound) return;
    el.dataset.bound = "1";
    const url = el.dataset.gif;
    if(GIF.mem.has(url)) return showImg(el, GIF.mem.get(url));
    io ? io.observe(el) : startSlot(el);
  });
}
function retryErrored(){
  document.querySelectorAll(".gif.err[data-gif]").forEach(el => { if(!GIF.dead.has(el.dataset.gif)) startSlot(el); });
}

  openSheet(`<div class="sheet-head"><h3>${mode === "edit" ? "Edit exercise" : "Add exercise"}</h3><button class="x" data-act="close" aria-label="Close">×</button></div>
    ${mode === "add" ? `<div class="field"><label for="pickSearch">Start from the library</label><input id="pickSearch" type="search" placeholder="Search by name or muscle" autocomplete="off"><div class="pick-list" id="pickList" hidden></div></div>` : ""}
    <details class="jefit"><summary>Import from a JEFIT page</summary>
      <div class="keyrow"><input id="jUrl" type="text" inputmode="url" placeholder="https://www.jefit.com/exercises/…" aria-label="JEFIT exercise page link"><button class="btn primary" type="button" data-act="import-jefit">Import</button></div>
      <p class="hint">Fetched through corsproxy.io with your key. This reads JEFIT’s page layout, so it may miss fields if JEFIT changes it.</p>
      <p class="status" id="jStatus" role="status"></p>
    </details>
    <div class="field"><label for="f_name">Exercise name</label><input id="f_name" type="text" value="${esc(ex.name)}" placeholder="e.g. Barbell Bench Press"></div>
    <div class="grid2">
      <div class="field"><label for="f_muscle">Muscle group</label><input id="f_muscle" type="text" value="${esc(ex.muscle)}" placeholder="e.g. Chest"></div>
      <div class="field"><label for="f_diff">Difficulty</label><select id="f_diff">${diffs.map(d => `<option ${d === ex.difficulty ? "selected" : ""}>${esc(d)}</option>`).join("")}</select></div>
      <div class="field"><label for="f_sets">Sets × reps</label><input id="f_sets" type="text" value="${esc(ex.sets)}" placeholder="e.g. 4 × 8–12"></div>
      <div class="field"><label for="f_rest">Rest</label><input id="f_rest" type="text" value="${esc(ex.rest)}" placeholder="e.g. 90 sec"></div>
    </div>
    <div class="field"><label for="f_how">How to do it</label><textarea id="f_how" placeholder="Step-by-step instructions">${esc(ex.instructions)}</textarea></div>
    <div class="field"><label for="f_gif">GIF link</label><input id="f_gif" type="text" inputmode="url" value="${esc(ex.gif)}" placeholder="https://… or a JEFIT GIF number like 2">
      <div class="preview" id="gifPreview"></div></div>
    ${mode === "add" ? `<label class="check"><input type="checkbox" id="f_lib" checked> Also save to my library</label>` : ""}
    <p class="status err" id="formMsg" role="alert"></p>
    <div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save-ex">Save exercise</button></div>`);
  previewGif();
}

function daySheet(dayId){
  DAYEDIT = dayId;
  const d = dayId ? getDay(dayId) : null;
  openSheet(`<div class="sheet-head"><h3>${d ? "Rename day" : "Add day"}</h3><button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="field"><label for="d_title">Day title</label><input id="d_title" type="text" value="${esc(d ? d.title : "Day " + (S.days.length + 1) + " — ")}" placeholder="Day 7 — Legs + Core">
    <p class="hint" style="margin-top:6px">Write it as “Day 7 — Legs + Core” to show the day number and focus on its tab.</p></div>
    <p class="status err" id="dMsg" role="alert"></p>
    <div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save-day">Save day</button></div>`);
  const i = $("#d_title"); i.focus(); i.setSelectionRange(i.value.length, i.value.length);
}

async function settingsSheet(){
  const key = getKey();
  const n = await dbCount();
  openSheet(`<div class="sheet-head"><h3>Settings</h3><button class="x" data-act="close" aria-label="Close">×</button></div>
    <section class="set">
      <h4>corsproxy.io key</h4>
      <p class="hint" style="margin-bottom:10px">Indiegym loads exercise GIFs through corsproxy.io, which needs a key. Paste yours here. It is saved only in this browser.</p>
      <div class="keyrow field"><label class="sr" for="keyInput">corsproxy.io key</label><input id="keyInput" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your key" value="${esc(key)}"><button class="btn" type="button" data-act="toggle-key">Show</button></div>
      <div class="actions" style="margin-top:0"><button class="btn primary" data-act="save-key">Save and test</button><button class="btn" data-act="remove-key">Remove key</button></div>
      <p class="status" id="keyStatus" role="status"></p>
      <p class="hint"><a href="https://console.corsproxy.io/" target="_blank" rel="noopener noreferrer">Get a key at console.corsproxy.io</a></p>
    </section>
    <section class="set">
      <h4>Saved GIFs</h4>
      <p class="hint" id="cacheInfo" style="margin-bottom:10px">${cacheText(n)}</p>
      <button class="btn" data-act="clear-cache">Clear saved GIFs</button>
    </section>
    <section class="set">
      <h4>Plan</h4>
      <p class="hint" style="margin-bottom:10px">Go back to the original 6-day upper-body plan. Your saved key and library additions are kept.</p>
      <button class="btn danger" data-act="reset-plan">Reset plan</button>
    </section>`);
}
const cacheText = n => n ? `${n} GIF${n === 1 ? "" : "s"} saved on this device. They load without using your corsproxy.io quota.` : "No GIFs saved yet. GIFs you view are kept on this device so they load without another proxy request.";

/* =========================================================
   Editor helpers
   ========================================================= */
function normalizeGif(v){
  v = String(v || "").trim().replace(/^["']|["']$/g, "");
  return /^\d+$/.test(v) ? CDN + v + ".gif" : v;
}
function previewGif(){
  const box = $("#gifPreview"); if(!box) return;
  const url = normalizeGif($("#f_gif").value);
  if(!/^https?:\/\//i.test(url)){
    box.innerHTML = `<p class="hint">Paste a GIF link or a JEFIT GIF number and it will show here.</p>`;
    return;
  }
  box.innerHTML = gifSlot(url, {alt: $("#f_name").value || "Exercise"}) + `<p class="hint">Preview</p>`;
  hydrate(box);
}
function renderPicks(){
  const q = $("#pickSearch").value.trim().toLowerCase(), box = $("#pickList");
  if(!q){ box.hidden = true; box.innerHTML = ""; return; }
  const list = libItems().filter(e => (e.name + " " + e.muscle).toLowerCase().includes(q)).slice(0, 8);
  box.hidden = false;
  box.innerHTML = list.length
    ? list.map(e => `<div class="pick" role="button" tabindex="0" data-act="pick-lib" data-name="${esc(e.name)}">${gifSlot(e.gif, {size: "sm", alt: e.name})}<span><b>${esc(e.name)}</b><small>${esc(e.muscle)}, ${esc(e.difficulty)}</small></span></div>`).join("")
    : `<p class="hint" style="padding:10px 12px">No match in the library. Fill in the fields below to make your own.</p>`;
  hydrate(box);
}

async function importJefit(){
  const url = $("#jUrl").value.trim();
  if(!/^https?:\/\/(www\.)?jefit\.com\//i.test(url)) return say("#jStatus", "That doesn’t look like a jefit.com link.", "err");
  const key = getKey();
  if(!key) return say("#jStatus", "Add your corsproxy.io key in Settings first.", "err");
  say("#jStatus", "Fetching from JEFIT…");
  try{
    const res = await fetch(proxyUrl(url, key));
    if(!res.ok) throw new Error("corsproxy.io returned " + res.status);
    const doc = new DOMParser().parseFromString(await res.text(), "text/html");
    const name = (doc.querySelector("h1")?.textContent || "").trim();

    let how = "";
    const ih = [...doc.querySelectorAll("h1,h2,h3,h4")].find(h => /instructions/i.test(h.textContent || ""));
    if(ih){
      const parts = [];
      for(let n = ih.nextElementSibling; n && !/^H[1-4]$/i.test(n.tagName); n = n.nextElementSibling){
        const t = (n.textContent || "").trim();
        if(t) parts.push(t);
      }
      how = parts.join("\n\n");
    }

    let gif = "";
    const idm = url.match(/\/exercises\/(\d+)/i);          // JEFIT GIFs are named after the exercise id
    if(idm) gif = CDN + idm[1] + ".gif";
    if(!gif){
      const img = [...doc.querySelectorAll("img")].find(i => /view\s*\d/i.test(i.alt || "") || /\/images\/exercises\//i.test(i.getAttribute("src") || ""));
      if(img){
        let src = img.getAttribute("src") || "";
        try{ const p = new URL(src, url); const inner = p.searchParams.get("url"); src = inner ? decodeURIComponent(inner) : p.href; }catch(e){}
        gif = src;
      }
    }
    if(!name && !how && !gif) throw new Error("no exercise details found on that page");
    if(name) $("#f_name").value = name;
    if(how) $("#f_how").value = how;
    if(gif){ $("#f_gif").value = gif; previewGif(); }
    say("#jStatus", "Filled in " + [name && "the name", how && "instructions", gif && "the GIF"].filter(Boolean).join(", ") + ". Check the fields, then set your sets and rest.", "ok");
  }catch(err){
    say("#jStatus", "Import failed: " + err.message + ". You can fill the fields in by hand.", "err");
  }
}

/* =========================================================
   Actions (click delegation)
   ========================================================= */
const ACT = {
  tab(t){ UI.tab = t.dataset.tab; render(); window.scrollTo(0, 0); },
  close(){ closeSheet(); },
  "confirm-yes"(){ const f = pendingYes; closeSheet(); if(f) f(); },
  "open-settings"(){ settingsSheet(); },
  "retry-gif"(t){ GIF.coolUntil = 0; const el = t.closest(".gif"); if(el) startSlot(el); },

  "pick-day"(t){ S.activeDay = t.dataset.id; save(); render(); },
  "add-day"(){ daySheet(null); },
  "edit-day"(){ if(S.activeDay) daySheet(S.activeDay); },
  "del-day"(){
    const d = curDay(); if(!d) return;
    ask(`Delete “${d.title}” and its ${d.exercises.length} exercise${d.exercises.length === 1 ? "" : "s"}?`, "Delete day", () => {
      const i = S.days.indexOf(d);
      S.days.splice(i, 1);
      S.activeDay = (S.days[i] || S.days[i - 1] || {}).id || null;
      save(); refresh();
    });
  },
  "save-day"(){
    const title = $("#d_title").value.trim();
    if(!title) return say("#dMsg", "Give the day a title.", "err");
    if(DAYEDIT){ getDay(DAYEDIT).title = title; }
    else{ const d = {id: uid(), title, exercises: []}; S.days.push(d); S.activeDay = d.id; }
    save(); closeSheet(); refresh();
  },

  "add-ex"(){ if(S.activeDay) editorSheet("add", S.activeDay); },
  "open-ex"(t){ const ex = getEx(t.dataset.day, t.dataset.id); if(ex) detailSheet(ex, {mode: "plan", dayId: t.dataset.day}); },
  "edit-ex"(t){ editorSheet("edit", t.dataset.day, t.dataset.id); },
  "del-ex"(t){
    const ex = getEx(t.dataset.day, t.dataset.id); if(!ex) return;
    ask(`Remove “${ex.name}” from this day?`, "Remove", () => {
      const d = getDay(t.dataset.day);
      d.exercises = d.exercises.filter(e => e.id !== ex.id);
      save(); refresh();
    });
  },
  "pick-lib"(t){
    const e = libItems().find(x => x.name === t.dataset.name); if(!e) return;
    $("#f_name").value = e.name; $("#f_muscle").value = e.muscle; $("#f_sets").value = e.sets; $("#f_rest").value = e.rest;
    $("#f_diff").value = e.difficulty; $("#f_how").value = e.instructions; $("#f_gif").value = e.gif;
    $("#pickSearch").value = ""; renderPicks(); previewGif();
  },
  "import-jefit"(){ importJefit(); },
  "save-ex"(){
    const name = $("#f_name").value.trim();
    if(!name){ say("#formMsg", "Give the exercise a name.", "err"); $("#f_name").focus(); return; }
    const data = {
      name, muscle: $("#f_muscle").value.trim(), sets: $("#f_sets").value.trim(), rest: $("#f_rest").value.trim(),
      difficulty: $("#f_diff").value, instructions: $("#f_how").value.trim(), gif: normalizeGif($("#f_gif").value)
    };
    if(EDIT.mode === "add"){
      getDay(EDIT.dayId).exercises.push({id: uid(), ...data});
      const cb = $("#f_lib");
      if(cb && cb.checked && !libItems().some(e => e.name.toLowerCase() === name.toLowerCase())) S.custom.push({...data, custom: true});
    }else{
      Object.assign(getEx(EDIT.dayId, EDIT.exId), data);
    }
    save(); closeSheet(); refresh();
  },

  group(t){ UI.group = t.dataset.g; renderChips(); updateLib(); },
  "open-lib"(t){ const e = libItems().find(x => x.name === t.dataset.name); if(e) detailSheet(e, {mode: "lib"}); },
  "add-from-lib"(t){
    const e = libItems().find(x => x.name === t.dataset.name);
    const day = getDay($("#addDay")?.value);
    if(!e || !day) return;
    day.exercises.push({id: uid(), name: e.name, muscle: e.muscle, sets: e.sets, rest: e.rest, difficulty: e.difficulty, instructions: e.instructions, gif: e.gif});
    save(); closeSheet(); refresh();
    toast("Added to " + splitTitle(day.title, S.days.indexOf(day)).label);
  },
  "del-custom"(t){
    S.custom = S.custom.filter(c => c.name !== t.dataset.name);
    save(); closeSheet(); refresh();
  },

  "toggle-key"(t){
    const i = $("#keyInput"), show = i.type === "password";
    i.type = show ? "text" : "password";
    t.textContent = show ? "Hide" : "Show";
  },
  async "save-key"(){
    const v = $("#keyInput").value.trim().replace(/^["']|["']$/g, "");
    if(!v) return say("#keyStatus", "Paste your key first.", "err");
    setKey(v);
    GIF.keyBad = false; GIF.coolUntil = 0;
    renderHeader();
    say("#keyStatus", "Testing key…");
    try{
      const blob = await fetchBlob(TEST_GIF, v);
      await dbPut(TEST_GIF, blob);
      remember(TEST_GIF, blob);
      say("#keyStatus", "Key works. GIFs will load now.", "ok");
      retryErrored();
      if(UI.tab === "plan" && $(".keybar")) render();   // drop the "add your key" banner
    }catch(e){
      renderHeader();
      say("#keyStatus", e.kind === "key"
        ? "corsproxy.io rejected this key. Check it at console.corsproxy.io and paste it again."
        : e.message + " Your key is saved. Try again in a moment.", "err");
      retryErrored();   // slots that said "Needs your key" now show the real reason
    }
    renderHeader();
    dbCount().then(n => { const c = $("#cacheInfo"); if(c) c.textContent = cacheText(n); });
  },
  "remove-key"(){
    setKey(""); GIF.keyBad = false;
    renderHeader();
    $("#keyInput").value = "";
    say("#keyStatus", "Key removed. GIFs you have already viewed still show from this device.", "ok");
    if(UI.tab === "plan") render();
  },
  async "clear-cache"(){
    await dbClear();
    GIF.mem.clear(); GIF.dead.clear();
    const c = $("#cacheInfo"); if(c) c.textContent = cacheText(0);
  },
  "reset-plan"(){
    ask("Reset to the original 6-day plan? Your changes to days and exercises will be discarded.", "Reset plan", () => {
      const d = buildDefault();
      S.days = d.days; S.activeDay = d.activeDay;
      save(); refresh(); toast("Plan reset");
    });
  }
};

document.addEventListener("click", e => {
  if(e.target === scrim) return closeSheet();
  const t = e.target.closest("[data-act]");
  if(t && ACT[t.dataset.act]) ACT[t.dataset.act](t, e);
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeSheet();
  if((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-act]')){
    e.preventDefault();
    e.target.click();
  }
});
let previewTimer;
document.addEventListener("input", e => {
  const id = e.target.id;
  if(id === "f_gif"){ clearTimeout(previewTimer); previewTimer = setTimeout(previewGif, 600); }
  else if(id === "libSearch"){ UI.q = e.target.value; updateLib(); }
  else if(id === "pickSearch"){ renderPicks(); }
});

/* =========================================================
   Start
   ========================================================= */
S = loadState();
render();
</script>
