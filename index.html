<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1B2CC1">
<script>
/* Apply the saved theme before first paint so there is no light flash in dark mode */
(function(){var p="";try{p=localStorage.getItem("indiegym_theme")||""}catch(e){}
var d=p?p==="dark":!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
document.documentElement.dataset.theme=d?"dark":"light";})();
</script>
<title>Indiegym</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B2CC1'/%3E%3Cg fill='white'%3E%3Crect x='3' y='12' width='3' height='8' rx='1'/%3E%3Crect x='7' y='9' width='3' height='14' rx='1'/%3E%3Crect x='10' y='14.5' width='12' height='3'/%3E%3Crect x='22' y='9' width='3' height='14' rx='1'/%3E%3Crect x='26' y='12' width='3' height='8' rx='1'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --slab:#1B2CC1;      /* ultramarine: identity colour */
  --ink:#101A4A;       /* deep navy text */
  --muted:#565D7E;
  --floor:#E3E5E9;     /* concrete */
  --paper:#FFFFFF;
  --line:#C9CDD6;
  --signal:#FF5B1F;    /* safety orange: attention only */
  --good:#1F9D55;
  --danger:#B3200C;
  --accent:#1B2CC1;    /* blue for text, links and icons (lighter in dark mode) */
  --bar:#1B2CC1;       /* top bar */
  --edge:#101A4A;      /* strong outlines */
  --field:#FFFFFF;     /* input backgrounds */
  --soft:#F3F4F7;      /* hover and empty-state surfaces */
  --press:#F1F2F7;
  --tap:rgba(255,255,255,.75);
  --hover:rgba(255,255,255,.5);
  --strong-bg:#101A4A; /* selected chips, toast, rest bar */
  --strong-fg:#FFFFFF;
  --on-signal:#101A4A; /* text on the orange signal colour */
  --scrim:rgba(16,26,74,.62);
  --ring:rgba(27,44,193,.18);
  --ok-text:#0F6B3A;
  --done-bg:#E8F6EE;
  --sheen-a:#FFFFFF;
  --sheen-b:#EDEFF5;
  color-scheme:light;
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --gl:max(16px,env(safe-area-inset-left));
  --gr:max(16px,env(safe-area-inset-right));
  --top-h:58px;
}
:root[data-theme="dark"]{
  --ink:#E8EBFA;
  --muted:#9CA5CB;
  --floor:#0D1120;
  --paper:#161B2E;
  --line:#2B3352;
  --danger:#FF8A78;
  --accent:#93A1FF;
  --bar:#151E8F;
  --edge:#5B6698;
  --field:#0F1424;
  --soft:#1F2640;
  --press:#1F2640;
  --tap:rgba(255,255,255,.06);
  --hover:rgba(255,255,255,.04);
  --strong-bg:#E8EBFA;
  --strong-fg:#0D1120;
  --scrim:rgba(3,5,14,.72);
  --ring:rgba(147,161,255,.32);
  --ok-text:#6FE3A1;
  --done-bg:#12301F;
  --sheen-a:#1B2138;
  --sheen-b:#272F4D;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--floor);color:var(--ink);font:16px/1.45 var(--font-body);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
body.has-active{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button,[data-act]{touch-action:manipulation}
button{-webkit-appearance:none;appearance:none}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Top bar ---------- */
.top{background:var(--bar);color:#fff;position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top)}
.top-in{max-width:1120px;margin:0 auto;padding:8px var(--gr) 8px var(--gl);display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1;letter-spacing:.01em}
.brand svg{width:30px;height:30px;fill:currentColor}
.keychip{border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:0 14px;min-height:38px;font-size:13px;font-weight:600;cursor:pointer}
.keychip.none,.keychip.bad{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.keychip.ok::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#7CF2A6;margin-right:8px}
.setbtn{display:none;align-items:center;gap:7px;border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:0 15px 0 11px;min-height:40px;font-size:13px;font-weight:600;cursor:pointer}
.setbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.setbtn:active{background:rgba(255,255,255,.16)}
.top-actions{display:flex;align-items:center;gap:8px}
.themebtn{display:inline-grid;place-items:center;width:40px;height:40px;padding:0;border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:50%;cursor:pointer}
.themebtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.themebtn:active{background:rgba(255,255,255,.16)}
.themebtn .i-sun{display:none}
:root[data-theme="dark"] .themebtn .i-sun{display:block}
:root[data-theme="dark"] .themebtn .i-moon{display:none}

/* ---------- Tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(6,1fr);background:var(--paper);border-top:1.5px solid var(--edge);padding-bottom:env(safe-area-inset-bottom)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;border:0;background:none;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.tab:active{background:var(--press)}

/* ---------- Layout ---------- */
.banner{max-width:1120px;margin:0 auto;padding:12px var(--gr) 0 var(--gl)}
.banner:empty{display:none}
.keybar{padding:12px 14px;background:var(--paper);border:1.5px solid var(--edge);border-radius:8px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.keybar p{font-size:14.5px;line-height:1.35}
.keybar .btn{flex:0 0 auto}
main{max-width:1120px;margin:0 auto;padding:0 var(--gr) 32px var(--gl)}

/* Workout rail */
.rail{position:sticky;top:calc(var(--top-h) - 1px);z-index:20;display:flex;gap:8px;overflow-x:auto;margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:12px var(--gr) 10px var(--gl);background:var(--floor);border-bottom:1px solid var(--line);scroll-snap-type:x proximity;scroll-padding-left:var(--gl);scrollbar-width:none}
.rail::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;width:120px;text-align:left;background:var(--paper);border:1.5px solid var(--edge);border-radius:8px;padding:9px 11px 10px;cursor:pointer;scroll-snap-align:start}
.dchip b{display:block;font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1}
.dchip span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.3;color:var(--muted);margin-top:4px;min-height:2.6em}
.dchip.on{background:var(--slab);border-color:var(--slab);color:#fff}
.dchip.on span{color:#DDE1FF}
.dchip.add{background:transparent;border-style:dashed;width:96px}

.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:16px 0 12px}
.day-head > div{min-width:0}
.day-head h2{font-family:var(--font-display);font-weight:800;font-size:clamp(36px,9vw,56px);line-height:.95}
.day-head .meta{color:var(--muted);font-size:14px;margin-top:8px}
.day-head .btn{flex:0 0 auto;margin-top:4px}
.head-actions{display:flex;flex:0 0 auto;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:6px;margin-top:4px}
.head-actions .btn{margin-top:0}
.start-btn{margin-bottom:14px}

.ex-list{border-top:2px solid var(--edge)}
.exercise-groups{border-top:2px solid var(--edge)}
.muscle-group{padding:0 0 8px}
.muscle-group + .muscle-group{border-top:12px solid var(--floor)}
.muscle-group-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 0 8px}
.muscle-group-head b{font-family:var(--font-display);font-size:27px;line-height:1;font-weight:800}
.muscle-group-head span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.muscle-part{margin-top:6px}
.muscle-part-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--soft);border:1px solid var(--line);border-radius:8px}
.muscle-part-head b{font-size:14px;font-weight:700}
.muscle-part-head span{font-size:12px;color:var(--muted);white-space:nowrap}
.group-ex-list{border-top:1px solid var(--line)}
.group-ex-list .ex{padding-left:4px;padding-right:4px}
@media(max-width:619px){
  .day-head{flex-wrap:wrap;row-gap:10px}
  .day-head > div:first-child{flex:1 1 100%;min-width:0}
  .head-actions{width:100%;justify-content:flex-start;gap:8px;margin-top:0}
  .head-actions .btn{flex:1 1 0;min-width:0}

  /* Prevent the GIF + text + remove/chevron controls from overflowing narrow phones. */
  .ex{grid-template-columns:80px minmax(0,1fr) 42px;gap:9px;padding:10px 0}
  .ex .gif{width:80px}
  .ex .go{display:none}
  .ex .icon-btn{width:42px;height:42px;padding:0}
  .ex-main h3{font-size:15px;line-height:1.22;overflow-wrap:anywhere}
  .ex-sub{gap:2px 8px}
  .ex-stats{gap:12px;margin-top:6px;flex-wrap:wrap}
  .ex-stats b{font-size:19px}

  .exercise-groups{overflow:hidden}
  .muscle-group-head{align-items:flex-start;gap:8px}
  .muscle-group-head b{font-size:25px;min-width:0;overflow-wrap:anywhere}
  .muscle-group-head span{flex:0 0 auto}
  .muscle-part-head{padding:8px 10px}
  .muscle-part-head b{min-width:0;overflow-wrap:anywhere}
}
/* Exercise rows: roomy desktop layout, compact mobile layout */
.ex{display:grid;grid-template-columns:112px minmax(0,1fr) 44px 18px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.ex:active{background:var(--tap)}
.ex .gif{width:112px}
.ex .go{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ex-main{min-width:0}
.ex-main h3{font-size:17px;line-height:1.25;font-weight:700}
.ex-sub{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;margin-top:3px}
.ex-muscle{color:var(--muted);font-size:13px}
.ex-stats{display:flex;gap:18px;margin-top:8px}
.ex-stats b{display:block;font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.05}
.ex-stats span{font-size:12px;color:var(--muted)}
.pips{display:inline-flex;align-items:center;gap:4px}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink)}
.pips i.on{background:var(--ink)}
.pips em{font-style:normal;font-size:12.5px;color:var(--muted);margin-left:5px}
.add-ex{margin-top:18px}

/* GIF slots */
.gif{position:relative;aspect-ratio:1/1;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.gif img{width:100%;height:100%;object-fit:contain;display:block}
.gif.loading{background:linear-gradient(100deg,var(--sheen-a) 30%,var(--sheen-b) 50%,var(--sheen-a) 70%) 0 0/220% 100%;animation:sheen 1.3s linear infinite}
@keyframes sheen{to{background-position:-220% 0}}
.gif.err,.gif.empty{background:var(--soft)}
.gif.lg{aspect-ratio:auto;width:100%;height:min(34vh,300px);height:min(34dvh,300px)}
.gif.sm{width:56px;flex:0 0 56px}
.gif-msg{font-size:12px;line-height:1.25;color:var(--muted);padding:0 8px}
.gif-btn{border:1.5px solid var(--edge);background:var(--paper);border-radius:999px;padding:0 12px;min-height:32px;font-size:12px;font-weight:700;cursor:pointer}
.gif:not(.lg) .gif-btn.k{display:none}
.gif.sm .gif-msg{display:none}
.gif.sm .gif-btn{font-size:10px;padding:0 6px;min-height:22px}

/* Library */
.lib-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:16px 0 8px}
.lib-head h2{font-family:var(--font-display);font-weight:800;font-size:clamp(36px,9vw,52px);line-height:.95}
.lib-head p{color:var(--muted);font-size:14px}
.lib-head .lib-head-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.lib-tools{position:sticky;top:calc(var(--top-h) - 1px);z-index:20;margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:8px var(--gr) 0 var(--gl);background:var(--floor);border-bottom:1px solid var(--line)}
.search input{width:100%;min-height:48px;border:1.5px solid var(--edge);border-radius:8px;padding:0 14px;background:var(--paper);font-size:16px}
.lib-filter-row{display:flex;gap:8px;margin-top:8px;align-items:center}
.lib-filter-row .btn{flex:0 0 auto}
.filter-summary{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.filter-grid label{display:flex;gap:9px;align-items:center;min-height:42px;font-size:14px}
.filter-grid input{width:20px;height:20px;accent-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:2px var(--gr) 10px var(--gl);scrollbar-width:none}
.gchip{flex:0 0 auto;min-height:40px;padding:0 15px;border-radius:999px;border:1.5px solid var(--edge);background:transparent;font-weight:600;font-size:14px;cursor:pointer}
.gchip.on{background:var(--strong-bg);color:var(--strong-fg)}
.lib-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px;margin-top:14px}
.tile{cursor:pointer;display:flex;flex-direction:column;gap:7px}
.tile:active .gif{border-color:var(--edge)}
.tile .gif{width:100%}
.tile-name{display:block;font-weight:700;font-size:14px;line-height:1.25}
.tile-meta{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.tile-area{color:var(--accent)}
.empty{grid-column:1/-1;color:var(--muted);padding:24px 0}

/* ---------- Build a muscle ---------- */
.bm-toggle{display:flex;justify-content:center;gap:8px;margin:14px 0}
.bmuscle-wrap{position:relative;background:var(--soft);border:1.5px solid var(--edge);border-radius:20px;padding:14px 10px 10px}
.bm-tooltip{position:absolute;left:0;top:0;pointer-events:none;background:var(--strong-bg);color:var(--strong-fg);font:800 13px var(--font-display);letter-spacing:.04em;text-transform:uppercase;padding:6px 12px;border-radius:9px;white-space:nowrap;opacity:0;transform:translate(-50%,-140%);transition:opacity .1s ease;z-index:5}
.bm-tooltip.on{opacity:1}
.bodymap{max-width:300px;margin:0 auto}
.bodymap svg{width:100%;height:auto;display:block}
.bm-ex-widget{background:var(--soft);border:1.5px solid var(--edge);border-radius:16px;padding:12px 10px 14px;margin:10px 0 16px}
.bm-ex-root{max-width:160px;margin:0 auto}
.bm-ex-root svg{width:100%;height:auto;display:block}
.bm-ex-caption{text-align:center;font-size:13px;color:var(--muted);margin:6px 0 0}
.bm-ex-muscle-name{color:#dc2626;font-weight:800}
.part-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
.part-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--edge);border-radius:10px;background:var(--paper);cursor:pointer;text-align:left;width:100%}
.part-card b{display:block;font-size:15.5px}
.part-card span{display:block;color:var(--muted);font-size:13px;margin-top:3px;line-height:1.35}
.part-card .go{flex:0 0 auto;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.4;margin-top:2px}
.bmex-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.bmex-row .gif{width:72px;flex:0 0 72px}
.bmex-main{flex:1;min-width:0;cursor:pointer}
.bmex-main h3{font-size:15px;font-weight:700}
@media(min-width:620px){ .part-grid{grid-template-columns:1fr 1fr} }

/* ---------- Buy me a coffee ---------- */
.coffee{max-width:420px;padding:10px;background:#fff}
.coffee img{display:block;width:100%;height:auto}
.coffee-note{max-width:420px;margin-top:12px}

/* ---------- Progress tab ---------- */
.hero{background:var(--slab);color:#fff;border-radius:12px;padding:18px;margin-top:16px}
.hero-top{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.lv-wrap{text-align:center;min-width:78px;border:2px solid rgba(255,255,255,.7);border-radius:12px;padding:6px 10px}
.lv-wrap span{display:block;font-size:12px;font-weight:600;color:#DDE1FF}
.lv-wrap b{display:block;font-family:var(--font-display);font-size:50px;line-height:1;font-weight:800}
.hero h2{font-family:var(--font-display);font-size:40px;line-height:1;font-weight:800}
.hero p{color:#DDE1FF;font-size:14px;margin-top:4px}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.bar i{display:block;height:100%;background:var(--signal);border-radius:inherit;transition:width .4s}
.bar.dark{background:var(--line)}
.bar.dark i{background:var(--accent)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--paper);border:1.5px solid var(--edge);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-family:var(--font-display);font-size:36px;line-height:1;font-weight:800}
.stat span{font-size:12.5px;color:var(--muted)}
.card{background:var(--paper);border:1.5px solid var(--edge);border-radius:8px;padding:14px;margin-top:12px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.card-head b{font-size:15px}
.card-head span{font-size:13.5px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wd{text-align:center;font-size:12px;color:var(--muted)}
.wd i{display:block;height:34px;margin-top:4px;border-radius:8px;border:1.5px solid var(--line);background:var(--field)}
.wd.on i{background:var(--accent);border-color:var(--accent)}
.wd.today{color:var(--ink);font-weight:700}
.wd.today i{border-color:var(--ink)}
.sec{font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1;margin:28px 0 12px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{background:var(--paper);border:1.5px solid var(--edge);border-radius:10px;padding:12px 6px;text-align:center}
.bd .g{width:52px;height:52px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:var(--signal);color:var(--on-signal);font-family:var(--font-display);font-weight:800;font-size:22px}
.bd b{display:block;font-size:12.5px;line-height:1.2}
.bd small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.25}
.bd.locked{border-color:var(--line);background:transparent}
.bd.locked .g{background:var(--line);color:var(--muted)}
.bd.locked b{color:var(--muted)}
.hist{border-top:2px solid var(--edge)}
.hrow{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;min-height:64px;cursor:pointer}
.hrow:active{background:var(--tap)}
.hrow b{display:block;font-size:16px}

/* ---------- Active workout ---------- */

  const pref = themePref(), dark = pref ? pref === "dark" : !!(darkMQ && darkMQ.matches);

function cleanHow(t){
  // JEFIT pages append "Alternative … Exercises" lists and menus to the instructions; drop them.
  return String(t || "").split(/\s*(?:Alternative [A-Za-z\- ]+ Exercises|Explore by Muscle)/)[0].replace(/\r\n/g, "\n").trim();
}
function normalizeScrapedExercise(e){
  const muscles = Array.isArray(e.muscles)
    ? e.muscles.map(x => String(x).trim()).filter(Boolean)
    : String(e.muscles || e.muscle || "").split(SPLIT).map(x => x.trim()).filter(Boolean);
  const rawEq = Array.isArray(e.equipment) ? e.equipment : String(e.equipment || "").split(/\s*[\/|,]\s*/);
  const eqDiff = rawEq.map(x => String(x).match(/^difficulty\s+(\w+)/i)).find(Boolean);   // scraped data sometimes lists difficulty under equipment
  const rd = String(e.difficulty || (eqDiff ? eqDiff[1] : "")).toLowerCase();
  const difficulty = rd === "beginner" ? "Easy" : rd === "intermediate" ? "Medium" : rd === "advanced" ? "Difficult" : (e.difficulty || "");
  const equipment = rawEq.map(x => String(x).trim()).filter(x => x && !/^difficulty\b/i.test(x)).join(" / ");
  return {
    ...e,
    name: String(e.name || "").trim(),
    muscle: String(e.muscle || muscles.join(" / ")).trim(),
    muscles, sets: e.sets ?? "", rest: e.rest ?? "", difficulty,
    instructions: cleanHow(e.instructions),
    gif: String(e.gif || "").trim(), equipment,
    sourceUrl: String(e.sourceUrl || "").trim(), jefitId: e.jefitId ?? "", source: e.source || "JEFIT"
  };
}

function normalizeLibraryEntry(e){
  if(!Array.isArray(e.muscles)) e.muscles = String(e.muscle || "").split(SPLIT).map(x => x.trim()).filter(Boolean);
  if(!e.muscle) e.muscle = e.muscles.join(" / ");
  if(!e.equipment){
    const n = String(e.name || "").toLowerCase();
    e.equipment = /machine|smith|cable|pulley/.test(n) ? "Strength Machine" : /barbell/.test(n) ? "Barbell" : /dumbbell/.test(n) ? "Dumbbell" : /ez[- ]?bar/.test(n) ? "EZ-Bar" : /kettlebell/.test(n) ? "Kettlebell" : /pull[- ]?up|chin[- ]?up|hanging/.test(n) ? "Pull Bar" : /band/.test(n) ? "Bands" : "Body Weight";
  }
  return e;
}

function ensureState(s){
  s.custom = Array.isArray(s.custom) ? s.custom : [];
  s.logs = Array.isArray(s.logs) ? s.logs : [];
  s.active = s.active && Array.isArray(s.active.exercises) ? s.active : null;
  s.profile = Object.assign({goal: 4, unit: "kg"}, s.profile || {});
  s.badges = s.badges && typeof s.badges === "object" ? s.badges : {};
  s.routine = Object.assign({mode: "auto", focus: ["chest"], level: "Any", equip: "All", count: 15, seed: 0}, s.routine || {});
  if(!Array.isArray(s.routine.focus)) s.routine.focus = [];
  s.routines = Array.isArray(s.routines) ? s.routines : [];
  s.builder = Object.assign({title: "", editing: null, exercises: []}, s.builder || {});
  if(!Array.isArray(s.builder.exercises)) s.builder.exercises = [];
  if(s.builder.editing && !s.routines.some(r => r.id === s.builder.editing)) s.builder.editing = null;
  
  if(!Array.isArray(s.days)) s.days = [];
  if(!s.days.some(d => d.id === s.activeDay)) s.activeDay = s.days[0]?.id || null;
  // Fill exercises that were saved before the library finished loading
  s.days.forEach(d => d.exercises.forEach(x => {
    const l = findLib(x.name);
    if(!x.gif && !x.instructions){ if(l) Object.assign(x, {...l, id: x.id, sets: x.sets, rest: x.rest}); }
    else if(l && !x.sources) EXTRA_FIELDS.forEach(k => { if(l[k] != null && x[k] == null) x[k] = l[k]; });
  }));
  return s;
}

function diffClass(label){
  const l = (label || "").toLowerCase();
  return l.includes("difficult") ? "difficult" : l.includes("medium") ? "medium" : "easy";
}
function splitTitle(title, i){
  const m = String(title).match(/^\s*(Day\s*\d+)\s*[—–-]\s*(.*)$/i);
  return m ? {label: m[1], focus: m[2] || title} : {label: "Day " + (i + 1), focus: title};
}
function overallDiff(day){
  const known = day.exercises.filter(e => e.difficulty);
  if(!known.length) return "";
  const c = {easy:0, medium:0, difficult:0};
  known.forEach(e => c[diffClass(e.difficulty)]++);
  if(c.difficult >= c.medium && c.difficult >= c.easy) return "difficult";
  return c.medium >= c.easy ? "medium" : "easy";
}

const startOfDay = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const startOfWeek = t => { const d = new Date(startOfDay(t)); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); };
const mmss = ms => { const s = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(s / 3600); const m = Math.floor(s % 3600 / 60); const r = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(r).padStart(2, "0"); };
const fmtMin = ms => { const m = Math.max(1, Math.round(ms / 60000)); return m >= 60 ? Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m" : m + " min"; };
const fmtDate = t => new Date(t).toLocaleDateString(undefined, {weekday: "short", day: "numeric", month: "short"});

/* =========================================================
   Gamification: XP, levels, streaks, badges, PRs
   ========================================================= */
const MAX_GAP_DAYS = 3;            // streak survives up to 2 rest days
const BADGE_XP = 50;
const TITLES = ["Rookie", "Regular", "Grinder", "Lifter", "Iron Head", "Beast", "Titan", "Legend"];
const lvlOf = xp => Math.floor(Math.sqrt(Math.max(0, xp) / 100)) + 1;
const xpAt = L => 100 * (L - 1) * (L - 1);
const titleOf = L => TITLES[Math.min(Math.floor((L - 1) / 3), TITLES.length - 1)];
const totalXp = () => S.logs.reduce((a, l) => a + (l.xp || 0), 0) + Object.keys(S.badges).length * BADGE_XP;

const nkey = n => String(n || "").trim().toLowerCase();
const metric = (w, r) => w > 0 ? w * (1 + r / 30) : r;   // estimated 1RM, or reps for bodyweight moves
const logsAsc = () => S.logs.slice().sort((a, b) => a.end - b.end);

function bestFor(name){
  let best = 0, top = null;
  S.logs.forEach(l => l.exercises.forEach(e => {
    if(nkey(e.name) !== nkey(name)) return;
    e.sets.forEach(s => { const m = metric(num(s.w), num(s.r)); if(m > best){ best = m; top = s; } });
  }));
  return {best, top};
}
function lastSets(name){
  const L = logsAsc();
  for(let i = L.length - 1; i >= 0; i--){
    const e = L[i].exercises.find(x => nkey(x.name) === nkey(name));
    if(e && e.sets.length) return e.sets.map(s => ({w: num(s.w), r: num(s.r)}));
  }
  return [];
}
function streakInfo(){
  const days = [...new Set(S.logs.map(l => startOfDay(l.end)))].sort((a, b) => b - a);
  if(!days.length) return {cur: 0, best: 0};
  const gap = (a, b) => Math.round((a - b) / DAY_MS);
  let best = 1, run = 1, cur = 0;
  for(let i = 1; i < days.length; i++){
    if(gap(days[i - 1], days[i]) <= MAX_GAP_DAYS){ run++; best = Math.max(best, run); } else run = 1;
  }
  if(gap(startOfDay(Date.now()), days[0]) <= MAX_GAP_DAYS){
    cur = 1;
    for(let i = 1; i < days.length && gap(days[i - 1], days[i]) <= MAX_GAP_DAYS; i++) cur++;
  }
  return {cur, best: Math.max(best, cur)};
}
function progressStats(){
  const L = S.logs, wk = startOfWeek(Date.now()), st = streakInfo();
  return {
    workouts: L.length,
    sets: L.reduce((a, l) => a + l.sets, 0),
    volume: L.reduce((a, l) => a + l.volume, 0),
    prs: L.reduce((a, l) => a + (l.prs ? l.prs.length : 0), 0),
    week: L.filter(l => l.end >= wk).length,

    early: L.some(l => new Date(l.start).getHours() < 8),
    night: L.some(l => new Date(l.start).getHours() >= 21)
  };
}

/* =========================================================
   GIF loading through the image CORS proxy
   ========================================================= */
const proxyUrl = (target, key) => PROXY_BASE + "?url=" + encodeURIComponent(target) + "&key=" + encodeURIComponent(key);
class GifError extends Error{ constructor(kind, msg){ super(msg); this.kind = kind; } }
const GIF = {mem: new Map(), pending: new Map(), dead: new Set(), keyBad: false, coolUntil: 0, active: 0, queue: [], MAX: 4};

function enqueue(task){ return new Promise((resolve, reject) => { GIF.queue.push({task, resolve, reject}); pump(); }); }
function pump(){
  while(GIF.active < GIF.MAX && GIF.queue.length){
    const j = GIF.queue.shift();
    GIF.active++;
    j.task().then(j.resolve, j.reject).finally(() => { GIF.active--; pump(); });
  }
}
let dbPromise;
function openDb(){
  if(!dbPromise) dbPromise = new Promise((res, rej) => {
    try{
      const r = indexedDB.open("indiegym", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("gifs");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }catch(e){ rej(e); }
  });
  return dbPromise;
}
const dbReq = (mode, fn) => openDb().then(db => new Promise((res, rej) => {
  const q = fn(db.transaction("gifs", mode).objectStore("gifs"));
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error);
}));
const dbGet = k => dbReq("readonly", s => s.get(k)).then(v => v || null).catch(() => null);
const dbPut = (k, v) => dbReq("readwrite", s => s.put(v, k)).catch(() => {});
const dbCount = () => dbReq("readonly", s => s.count()).catch(() => 0);
const dbClear = () => dbReq("readwrite", s => s.clear()).catch(() => {});

function remember(url, blob){
  if(GIF.mem.has(url)) return GIF.mem.get(url);
  const o = URL.createObjectURL(blob);
  GIF.mem.set(url, o);
  return o;
}
async function fetchBlob(target, key){
  let res;
  try{ res = await fetch(proxyUrl(target, key)); }
  catch(e){ throw new GifError("network", "Could not reach the image proxy. Check your connection."); }
  if(!res.ok){
    const text = (await res.text().catch(() => "")).trim();
    const snippet = text.slice(0, 140);
    if(res.status === 401 || ((res.status === 402 || res.status === 403) && /key|unauthori[sz]ed/i.test(text))){
      GIF.keyBad = true; throw new GifError("key", "The proxy rejected the key.");
    }
    if(res.status === 429){ GIF.coolUntil = Date.now() + 30000; throw new GifError("rate", "The proxy says you have hit a rate limit. Wait a moment, then retry."); }
    if(res.status === 404){ GIF.dead.add(target); throw new GifError("missing", "No GIF found at this link (404)."); }
    throw new GifError("http", "The proxy returned " + res.status + (snippet ? ": " + snippet : "."));
  }
  let blob = await res.blob();
  if(!/^image\//.test(blob.type)){
    const head = await blob.slice(0, 6).text().catch(() => "");
    if(head.startsWith("GIF8")) blob = new Blob([blob], {type: "image/gif"});
    else{
      const text = await blob.text().catch(() => "");
      if(text.length < 500 && /\bkey\b/i.test(text)){ GIF.keyBad = true; throw new GifError("key", "The proxy rejected the key."); }
      throw new GifError("type", "The response was not an image.");
    }
  }
  return blob;
}
function loadGif(url){
  if(GIF.mem.has(url)) return Promise.resolve(GIF.mem.get(url));
  if(GIF.pending.has(url)) return GIF.pending.get(url);
  const p = (async () => {
    const hit = await dbGet(url);
    if(hit) return remember(url, hit);
    if(GIF.dead.has(url)) throw new GifError("missing", "No GIF found at this link.");
    const key = getKey();
    if(!key) throw new GifError("nokey", "Add your proxy key to load GIFs.");
    if(GIF.keyBad) throw new GifError("key", "The proxy rejected the key.");
    if(Date.now() < GIF.coolUntil) throw new GifError("rate", "Rate limit reached. Wait a moment, then retry.");
    const blob = await enqueue(() => fetchBlob(url, key));
    dbPut(url, blob);
    return remember(url, blob);
  })();
  GIF.pending.set(url, p);
  p.then(() => GIF.pending.delete(url), () => GIF.pending.delete(url));
  return p;
}
function gifSlot(url, {size = "md", alt = "", video = false} = {}){
  if(!url) return `<div class="gif ${size} empty"><span class="gif-msg">${video ? "Video demo" : "No GIF"}</span></div>`;
  return `<div class="gif ${size} loading" data-gif="${esc(url)}" data-alt="${esc(alt)}"></div>`;
}
function showImg(el, src){
  el.classList.remove("loading", "err");
  el.removeAttribute("title");

const SHORT = {nokey:"Needs your key", key:"Key rejected", rate:"Rate limited", network:"Can’t reach proxy", missing:"GIF not found", type:"Not an image", http:"Couldn’t load"};
function showErr(el, e){
  const kind = e.kind || "http";
  el.classList.remove("loading");
  el.classList.add("err");

  const btn = (kind === "nokey" || kind === "key")

  el.innerHTML = `<span class="gif-msg">${esc(SHORT[kind] || SHORT.http)}</span>${btn}`;

async function startSlot(el){
  const url = el.dataset.gif;
  el.classList.remove("err");
  el.classList.add("loading");

  try{
    const src = await loadGif(url);
    if(el.isConnected && el.dataset.gif === url) showImg(el, src);
  }catch(e){ if(el.isConnected) showErr(el, e); }
}
const io = "IntersectionObserver" in window
  ? new IntersectionObserver(entries => entries.forEach(en => { if(en.isIntersecting){ io.unobserve(en.target); startSlot(en.target); } }), {rootMargin: "300px"})
  : null;
function hydrate(root = document){
  root.querySelectorAll(".gif[data-gif]").forEach(el => {
    if(el.dataset.bound) return;
    el.dataset.bound = "1";
    const url = el.dataset.gif;
    if(GIF.mem.has(url)) return showImg(el, GIF.mem.get(url));
    io ? io.observe(el) : startSlot(el);
  });
}

function exerciseClassification(ex){
  const ms = muscleKeys(ex);
  const group = BODY_GROUPS.find(g => ms.includes(canon(g))) || "Other";
  if(group === "Other") return {group, part:"General"};

  let part = "";
  const areas = Array.isArray(ex.muscleAreas) ? ex.muscleAreas : [];
  const idx = ms.findIndex(k => k === canon(group));
  if(idx >= 0 && areas[idx]) part = String(areas[idx]);

  if(!part){
    const M = PART_MATCHERS[group];
    if(M){
      let pi = M.defaultPart;
      for(const r of M.rules){
        if(r.re.test(ex.name || "")){ pi = r.part; break; }
      }
      part = MUSCLE_TAXONOMY[group]?.parts?.[pi]?.name || "";
    }
  }
  return {group, part: part || "General"};
}

function groupedExerciseData(items, getEx = x => x){
  const groups = [];
  const groupMap = new Map();
  items.forEach((item, index) => {
    const ex = getEx(item);
    const c = exerciseClassification(ex);
    let g = groupMap.get(c.group);
    if(!g){
      g = {group:c.group, parts:[], partMap:new Map(), first:index};
      groupMap.set(c.group, g);
      groups.push(g);
    }
    let part = g.partMap.get(c.part);
    if(!part){
      part = {part:c.part, items:[], first:index};
      g.partMap.set(c.part, part);
      g.parts.push(part);
    }
    part.items.push({item, index});
  });
  groups.sort((a,b) => {
    const ai = BODY_GROUPS.indexOf(a.group), bi = BODY_GROUPS.indexOf(b.group);
    const ar = ai < 0 ? 999 : ai, br = bi < 0 ? 999 : bi;
    return ar - br || a.first - b.first;
  });
  groups.forEach(g => g.parts.sort((a,b) => a.first - b.first));
  return groups;
}

function groupedExerciseHtml(items, getEx, rowRenderer){

const DEFAULT_EQ = ["Body Weight","Bands","Barbell","Bench","Cardio Machine","Dumbbell","EZ Curl Bar","Exercise Ball","Kettlebell","Pullup Bar","Strength Machine","Weight Plate","Other"];
const canon = s => String(s || "").trim().toLowerCase();
const titleCase = s => String(s).replace(/\b\w/g, c => c.toUpperCase());
function muscleKeys(e){
  const arr = Array.isArray(e.muscles) && e.muscles.length ? e.muscles : String(e.muscle || "").split(SPLIT);
  return [...new Set(arr.map(canon).filter(Boolean))];
}
function equipList(e){
  const raw = Array.isArray(e.equipment) ? e.equipment : String(e.equipment || "").split(/\s*[\/|,]\s*/);
  const l = raw.map(x => String(x).trim()).filter(Boolean);
  return l.length ? l : ["Body Weight"];
}
const diffOf = e => e.difficulty ? diffClass(e.difficulty) : "";
const hasVideo = e => !!(e.video || e.videoDeep);
const searchHay = e => [e.name, (e.aliases || []).join(" "), muscleKeys(e).join(" "), equipList(e).join(" "), e.primeMover || "", (e.supportMuscles || []).join(" "), (e.movement || []).join(" ")].join(" ").toLowerCase();
const EXTRA_FIELDS = ["video","videoDeep","primeMover","supportMuscles","movement","plane","bodyRegion","force","laterality","posture","grip","classification","mechanics","skillLevel","sources"];
const isWorkout = e => !NOT_WORKOUT.test(e.name) && e.classification !== "Mobility";

/* Filter options come from the data, so they always match what exists */
function facets(){
  const mus = new Map(), eq = new Map();
  libItems().forEach(e => {
    (Array.isArray(e.muscles) && e.muscles.length ? e.muscles : String(e.muscle || "").split(SPLIT)).forEach(m => {
      const k = canon(m); if(!k) return;
      const o = mus.get(k) || {key: k, label: titleCase(String(m).trim()), n: 0}; o.n++; mus.set(k, o);
    });
    equipList(e).forEach(x => { const k = canon(x); const o = eq.get(k) || {key: k, label: x, n: 0}; o.n++; eq.set(k, o); });
  });
  return {muscles: [...mus.values()], equipment: [...eq.values()].sort((a, b) => a.label.localeCompare(b.label))};
}
function passes(e, tokens){
  const ms = muscleKeys(e);
  if(UI.muscles.length){
    const ok = UI.matchAll ? UI.muscles.every(k => ms.includes(k)) : UI.muscles.some(k => ms.includes(k));
    if(!ok) return false;
  }
  if(UI.difficulty !== "All" && diffOf(e) !== UI.difficulty.toLowerCase()) return false;
  if(UI.equipment !== "All" && !equipList(e).map(canon).includes(UI.equipment)) return false;
  if(UI.media === "GIF" && !e.gif) return false;
  if(UI.media === "Video" && !hasVideo(e)) return false;
  if(tokens.length){
    const hay = searchHay(e);
    if(!tokens.every(t => hay.includes(t))) return false;
  }
  return true;
}
function filterCount(){ return UI.muscles.length + (UI.difficulty !== "All" ? 1 : 0) + (UI.equipment !== "All" ? 1 : 0) + (UI.media !== "All" ? 1 : 0); }
function filterSummary(){
  const F = facets(), lab = k => F.muscles.find(m => m.key === k)?.label || titleCase(k);
  const bits = [];
  if(UI.muscles.length) bits.push((UI.matchAll && UI.muscles.length > 1 ? "All of " : "") + UI.muscles.map(lab).join(", "));
  if(UI.difficulty !== "All") bits.push(UI.difficulty);
  if(UI.equipment !== "All") bits.push(F.equipment.find(x => x.key === UI.equipment)?.label || UI.equipment);
  if(UI.media !== "All") bits.push(UI.media === "GIF" ? "Has GIF" : "Has video");
  return bits.length ? bits.join(" · ") : "No filters applied";
}
function libSkeleton(){
  return `<div class="lib-head"><div><h2>Library</h2><p id="libCount"></p></div><div class="lib-head-actions"><button class="btn primary sm" data-act="add-lib-ex">Add exercise</button></div></div>

      <div class="search"><label class="sr" for="libSearch">Search exercises</label><input id="libSearch" type="search" enterkeyhint="search" placeholder="Search by name, muscle or equipment" value="${esc(UI.q)}" autocomplete="off"></div>
      <div class="lib-filter-row"><button class="btn sm" id="filterBtn" data-act="open-lib-filters"></button><span class="filter-summary" id="filterSum"></span></div>
      <div class="chips" id="libChips"></div>
    </div>
    <div class="lib-grid" id="libGrid"></div>`;
}
function syncFilterUI(){
  const fb = $("#filterBtn"); if(!fb) return;
  fb.textContent = "Filters" + (filterCount() ? " (" + filterCount() + ")" : "");
  $("#filterSum").textContent = filterSummary();
  const chips = [{key: "", label: "All", on: !UI.muscles.length}]
    .concat(facets().muscles.sort((a, b) => b.n - a.n || a.label.localeCompare(b.label)).map(m => ({key: m.key, label: m.label, on: UI.muscles.includes(m.key)})));
  $("#libChips").innerHTML = chips.map(c => `<button class="gchip ${c.on ? "on" : ""}" data-act="group" data-g="${esc(c.key)}" aria-pressed="${c.on}">${esc(c.label)}</button>`).join("");
}
function tile(e){
  const muscleBit = esc((e.muscles && e.muscles.length ? e.muscles : [e.muscle]).join(" / ")) + (e.muscleAreaLabel ? ` <span class="tile-area">(${esc(e.muscleAreaLabel)})</span>` : "");
  return `<div class="tile" role="button" tabindex="0" data-act="open-lib" data-name="${esc(e.name)}" aria-label="${esc(e.name)}, open details">
    ${gifSlot(e.gif, {alt: e.name, video: hasVideo(e)})}
    <div><span class="tile-name">${esc(e.name)}</span><span class="tile-meta">${muscleBit} · ${esc(equipList(e).join(" / "))}${e.custom ? ", yours" : ""}</span></div>
  </div>`;
}
function updateLib(){
  const tokens = UI.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const list = libItems().filter(e => passes(e, tokens));
  $("#libCount").textContent = list.length + " exercise" + (list.length === 1 ? "" : "s");
  const shown = list.slice(0, UI.libLimit);
  $("#libGrid").innerHTML = list.length
    ? shown.map(tile).join("") + (list.length > shown.length ? `<div class="more"><button class="btn wide" data-act="lib-more">Show more (${list.length - shown.length} left)</button></div>` : "")
    : `<p class="empty">No exercises match. Clear a filter or try another search.</p>`;
  hydrate($("#libGrid"));
}
function libraryFilterSheet(){
  const F = facets();
  const checks = F.muscles.slice().sort((a, b) => a.label.localeCompare(b.label)).map(m => `<label><input type="checkbox" data-filter-muscle="${esc(m.key)}" ${UI.muscles.includes(m.key) ? "checked" : ""}>${esc(m.label)}</label>`).join("");
  const diffs = ["All","Easy","Medium","Difficult"].map(d => `<option ${UI.difficulty === d ? "selected" : ""}>${d}</option>`).join("");
  const eqs = `<option value="All">All</option>` + F.equipment.map(x => `<option value="${esc(x.key)}" ${UI.equipment === x.key ? "selected" : ""}>${esc(x.label)}</option>`).join("");
  openSheet(sheetHtml({title: "Library filters", body: `
    <div class="set"><h4>Target muscle groups</h4><p class="hint">Pick one or several. Turn on “Match all” to see only exercises that hit every muscle you picked.</p><label class="check"><input type="checkbox" id="filterMatchAll" ${UI.matchAll ? "checked" : ""}> Match all selected muscles</label><div class="filter-grid">${checks}</div></div>
    <div class="set"><h4>Difficulty</h4><div class="field"><select id="filterDifficulty">${diffs}</select></div></div>
    <div class="set"><h4>Equipment / machine</h4><div class="field"><select id="filterEquipment">${eqs}</select></div></div>
    <div class="set"><h4>Demo</h4><div class="field"><select id="filterMedia">${["All","GIF","Video"].map(m => `<option value="${m}" ${UI.media === m ? "selected" : ""}>${m === "All" ? "Any" : m === "GIF" ? "Has an animated GIF" : "Has a YouTube video"}</option>`).join("")}</select></div></div>`,
    foot: `<div class="actions" style="margin-top:0"><button class="btn" data-act="reset-lib-filters">Reset</button><button class="btn primary" data-act="apply-lib-filters">Apply filters</button></div>`}));
}

/* ----- Progress ----- */
function progressView(){
  const xp = totalXp(), L = lvlOf(xp), a = xpAt(L), b = xpAt(L + 1);
  const pct = clamp(Math.round((xp - a) / (b - a) * 100), 0, 100);
  const s = progressStats();
  const wk = startOfWeek(Date.now()), today = startOfDay(Date.now());
  const trained = new Set(S.logs.map(l => startOfDay(l.end)));
  const days = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((n, i) => {
    const d = new Date(wk); d.setDate(d.getDate() + i);
    const t = d.getTime();
    return `<div class="wd ${trained.has(t) ? "on" : ""} ${t === today ? "today" : ""}">${n}<i></i></div>`;
  }).join("");
  const goalPct = S.profile.goal ? clamp(Math.round(s.week / S.profile.goal * 100), 0, 100) : 0;
  const got = BADGES.filter(x => S.badges[x.id]).length;
  const badges = BADGES.map(x => {
    const at = S.badges[x.id];
    return `<div class="bd ${at ? "" : "locked"}"><div class="g">${esc(x.g)}</div><b>${esc(x.name)}</b><small>${at ? "Unlocked " + esc(fmtDate(at)) : esc(x.desc)}</small></div>`;
  }).join("");
  const hist = logsAsc().reverse().slice(0, 60).map(l => `<button class="hrow" data-act="open-log" data-id="${l.id}">
      <span><b>${esc(l.title)}</b><small>${esc(fmtDate(l.end))} · ${fmtMin(l.end - l.start)} · ${l.sets} sets · ${fmtNum(l.volume)} ${esc(unit())}</small></span>
      ${l.prs && l.prs.length ? `<span class="pill">${l.prs.length} PR</span>` : ""}</button>`).join("");
  return `<section class="hero">
      <div class="hero-top"><div class="lv-wrap"><span>Level</span><b>${L}</b></div><div><h2>${esc(titleOf(L))}</h2><p>${fmtNum(xp)} XP total</p></div></div>
      <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progress to next level"><i style="width:${pct}%"></i></div>
      <p>${fmtNum(b - xp)} XP to level ${L + 1}</p>
    </section>
    <div class="stat-row">
      <div class="stat"><b>${s.cur}</b><span>day streak</span></div>
      <div class="stat"><b>${s.workouts}</b><span>workouts</span></div>
      <div class="stat"><b>${s.prs}</b><span>personal records</span></div>
    </div>
    <section class="card">
      <div class="card-head"><b>This week</b><span>${s.week} of ${S.profile.goal || "–"} workouts</span></div>
      <div class="bar dark" style="margin-top:10px"><i style="width:${goalPct}%"></i></div>
      <div class="week">${days}</div>
      <p class="hint" style="margin-top:12px">Your streak survives up to 2 rest days in a row. Change your weekly goal in Settings.</p>
    </section>
    <button class="btn primary wide" style="margin-top:12px" data-act="start-empty">Start an empty workout</button>
    <h2 class="sec">Badges (${got}/${BADGES.length})</h2>
    <div class="badges">${badges}</div>
    <h2 class="sec">History</h2>
    ${hist ? `<div class="hist">${hist}</div>` : `<p class="hint">No workouts logged yet. Start one from the Plan tab and it will show up here.</p>`}`;
}

/* =========================================================
   Build a muscle: body diagram -> muscle parts -> targeted exercises
   ========================================================= */
function partExercises(group, partIndex){
  const gk = canon(group);
  const pool = libItems().filter(isWorkout).filter(e => muscleKeys(e).includes(gk));
  const M = PART_MATCHERS[group];
  if(!M) return {list: pool, fallback: false};
  const matchedPart = e => { for(const r of M.rules) if(r.re.test(e.name)) return r.part; return M.defaultPart; };
  let list = pool.filter(e => matchedPart(e) === partIndex);
  let fallback = false;
  if(!list.length){ list = pool; fallback = true; }
  return {list, fallback};
}
/* body-muscles integration: classify the library's 70+ anatomical regions into
   our own broad MUSCLE_TAXONOMY groups by matching on their human-readable name,
   so we don't have to hardcode the library's internal muscle-id list. */
let BM_CHART = null;
let BM_BASE_STATE = null;
let BM_HOVER_ID = null;
const BM_DEFS_CACHE = {};
function bmClassify(name){
  const n = (name || "").toLowerCase();
  if(/chest|pec/.test(n)) return "Chest";
  if(/lat(?:issimus)?|trapezius|\btrap\b|rhomboid|spine|\bback\b/.test(n)) return "Back";
  if(/delt|shoulder/.test(n)) return "Shoulders";
  if(/bicep/.test(n)) return "Biceps";
  if(/tricep/.test(n)) return "Triceps";
  if(/forearm/.test(n)) return "Forearms";
  if(/abdominal|oblique|\babs\b|\bcore\b/.test(n)) return "Abs";
  if(/glute/.test(n)) return "Glutes";
  if(/quad|hamstring|adductor|thigh/.test(n)) return "Upper Legs";
  if(/calv|tibialis|shin|soleus|gastrocnemius/.test(n)) return "Lower Legs";
  return null;
}
function bmMuscleDefs(view){
  if(BM_DEFS_CACHE[view]) return BM_DEFS_CACHE[view];
  const BM = window.BodyMuscles;
  if(!BM || !BM.filterMuscles) return [];
  const side = view === "back" ? BM.ViewSide.BACK : BM.ViewSide.FRONT;
  const defs = BM.filterMuscles(side) || [];
  BM_DEFS_CACHE[view] = defs;
  return defs;
}
function bmBuildState(view){
  const state = {};
  bmMuscleDefs(view).forEach(d => {
    const grp = bmClassify(d.name);
    const info = grp && MUSCLE_TAXONOMY[grp];
    const active = UI.build.group && grp === UI.build.group;
    state[d.id] = {
      intensity: info ? Math.max(2, Math.min(9, Math.round(info.exerciseCount / 40))) : 0,
      selected: !!active
    };
  });
  return state;
}
function bmApplyHover(hoverId){
  if(!BM_CHART || !BM_BASE_STATE) return;
  BM_HOVER_ID = hoverId;
  const state = {...BM_BASE_STATE};
  if(hoverId){
    const cur = state[hoverId] || {intensity: 0, selected: false};
    state[hoverId] = {...cur, intensity: 10}; // 10 = red on the library's 0-10 gradient
  }
  BM_CHART.update({bodyState: state});
}
function bmDestroyChart(){
  if(BM_CHART){ try{ BM_CHART.destroy(); }catch(e){} BM_CHART = null; }
  BM_BASE_STATE = null;
  BM_HOVER_ID = null;
}
/* ---------- Per-exercise "muscle targeted" body-muscles diagram ----------
   Maps this dataset's own vocabulary — the verified `primeMover` name where
   we have one (175 exercises), falling back to the broad JEFIT `muscles`
   group otherwise — onto the body-muscles library's anatomical region ids,
   so every exercise's description can show exactly where it hits on the
   body, highlighted in red (intensity 9 on the library's 0-10 scale). */
const EX_MUSCLE_REGIONS = {
  // exact anatomical target — used when the dataset's verified primeMover is known
  "Biceps Brachii": {view: "FRONT", ids: ["biceps-left", "biceps-right"]},
  "Pectoralis Major": {view: "FRONT", ids: ["chest-upper-left", "chest-lower-left", "chest-upper-right", "chest-lower-right"]},
  "Latissimus Dorsi": {view: "BACK", ids: ["lats-upper-left", "lats-mid-left", "lats-lower-left", "lats-upper-right", "lats-mid-right", "lats-lower-right"]},
  "Rectus Abdominis": {view: "FRONT", ids: ["abs-upper-left", "abs-upper-right", "abs-lower-left", "abs-lower-right"]},

const scrim = $("#scrim"), sheetEl = $("#sheet");
let pendingYes = null, EDIT = null, DAYEDIT = null, sheetOpen = false;
let backPending = false, wantPush = false, backTimer = 0;   // NEW: guards against a stale history.back()

  function openSheet(html){
  SHEET = "";
  sheetEl.innerHTML = html;
  resetSheetMotion();
  scrim.classList.add("open");
  document.body.classList.add("noscroll");
  const b = $("#sheetBody"); if(b) b.scrollTop = 0;
  if(!sheetOpen){
    sheetOpen = true;
    if(backPending) wantPush = true;   // a back() is still in flight: push after it finishes
    else{ try{ history.pushState({sheet: 1}, ""); }catch(e){} }
  }
  hydrate(sheetEl);
}

function closeSheet(fromPop){
  if(!sheetOpen) return;
  sheetOpen = false; wantPush = false; SHEET = "";
  scrim.classList.remove("open");
  document.body.classList.remove("noscroll");
  sheetEl.innerHTML = "";
  resetSheetMotion();
  pendingYes = null;
  if(fromPop !== true && !backPending){
    try{
      if(history.state && history.state.sheet){
        backPending = true;
        clearTimeout(backTimer);
        backTimer = setTimeout(() => { backPending = false; wantPush = false; }, 1000);   // safety net
        history.back();
      }
    }catch(e){ backPending = false; }
  }
}

window.addEventListener("popstate", () => {
  if(backPending){                      // this popstate is the one we caused ourselves
    backPending = false;
    clearTimeout(backTimer);
    if(wantPush){                       // a new sheet was opened meanwhile, so give it its history entry now
      wantPush = false;
      try{ history.pushState({sheet: 1}, ""); }catch(e){}
    }
    return;                             // don't close the sheet that is open now
  }
  if(sheetOpen) closeSheet(true);       // a real Back press
});
function sheetHtml({title, body, foot = "", close = true}){

/* Close, wait for the browser's history step, then run fn (safe when fn opens another sheet) */
function closeThen(fn){
  if(!sheetOpen) return fn();
  let done = false;
  const go = () => { if(done) return; done = true; window.removeEventListener("popstate", go); fn(); };
  window.addEventListener("popstate", go);
  setTimeout(go, 250);
  closeSheet();
}
window.addEventListener("popstate", () => { if(sheetOpen) closeSheet(true); });

let drag = null;
sheetEl.addEventListener("pointerdown", e => {
  if(e.pointerType === "mouse" || !e.target.closest(".grab,.sheet-head") || e.target.closest("button")) return;
  drag = {y: e.clientY, dy: 0, id: e.pointerId, on: false};
});
sheetEl.addEventListener("pointermove", e => {
  if(!drag || e.pointerId !== drag.id) return;
  const dy = e.clientY - drag.y;
  if(!drag.on && Math.abs(dy) > 6){
    drag.on = true;
    try{ sheetEl.setPointerCapture(e.pointerId); }catch(_){}
    sheetEl.style.animation = "none"; sheetEl.style.transition = "none";
  }
  if(drag.on){ drag.dy = Math.max(0, dy); sheetEl.style.transform = "translateY(" + drag.dy + "px)"; }
});
function endDrag(e){
  if(!drag || e.pointerId !== drag.id) return;
  const {dy, on} = drag; drag = null;
  if(!on) return;
  if(dy > 110) return closeSheet();
  sheetEl.style.transition = "transform .18s ease-out";
  sheetEl.style.transform = "";
  setTimeout(() => { if(sheetOpen) sheetEl.style.transition = ""; }, 220);
}
sheetEl.addEventListener("pointerup", endDrag);

/* Pull the 11-character video id out of youtu.be, watch?v=, embed, shorts and live links */
function ytId(u){

}

  const deep = e.videoDeep ? `<a class="btn sm" href="${esc(e.videoDeep)}" target="_blank" rel="noopener">In-depth explanation</a>` : "";
  const panel = id ? `<div class="demo" id="demoPanel" data-id="${esc(id)}" data-title="${esc(e.name)} demo video" data-href="${esc(e.video)}" inert>
      <div class="demo-clip"><div class="demo-inner">

/* =========================================================
   Drag-to-reorder lists (mouse and touch, via Pointer Events)
   ========================================================= */
function initSortable(listEl, onReorder){
  if(!listEl) return;
  let drag = null;
  const items = () => [...listEl.querySelectorAll(":scope > [data-sort-id]")];
  function move(e){
    if(!drag) return;
    e.preventDefault();
    const y = e.clientY;
    let target = null;
    for(const sib of items()){
      if(sib === drag.row) continue;
      const r = sib.getBoundingClientRect();
      if(y < r.top + r.height / 2){ target = sib; break; }
    }
    if(target){ if(target !== drag.row.nextElementSibling) listEl.insertBefore(drag.row, target); }
    else if(listEl.lastElementChild !== drag.row) listEl.appendChild(drag.row);
  }
  function end(e){
    if(!drag || e.pointerId !== drag.pid) return;
    drag.row.classList.remove("dragging");
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", end);
    document.removeEventListener("pointercancel", end);
    const order = items().map(el => el.dataset.sortId);
    drag = null;
    onReorder(order);
  }
  listEl.addEventListener("pointerdown", e => {
    const handle = e.target.closest(".drag-handle");
    if(!handle || !listEl.contains(handle)) return;
    const row = handle.closest("[data-sort-id]");
    if(!row) return;
    e.preventDefault();
    drag = {row, pid: e.pointerId};
    row.classList.add("dragging");
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", end);
    document.addEventListener("pointercancel", end);
  });
}

/* =========================================================
   Workout logging
   ========================================================= */
function restSecs(str){
  const m = String(str || "").match(/(\d+)/);
  if(!m) return 60;
  return clamp(+m[1] * (/min/i.test(str) ? 60 : 1), 10, 600);
}
function makeLogEx(ex){
  const target = String(ex.sets || DEFAULT_SETS);
  const m = target.match(/^\s*(\d+)/);
  const n = clamp(m ? +m[1] : 3, 1, 10);
  const r = target.match(/[×x]\s*(\d+)/i);
  const timed = /\b(sec|secs|seconds|min)\b/i.test(target);
  const prev = lastSets(ex.name);
  const sets = Array.from({length: n}, (_, i) => {
    const p = prev[i] || prev[prev.length - 1];
    return {w: p && p.w ? String(p.w) : "", r: p && p.r ? String(p.r) : "", done: false};
  });
  return {name: ex.name, gif: ex.gif || "", muscle: ex.muscle || "", target, rest: ex.rest || "", timed, rl: r ? r[1] : "", prev, sets};
}
function startWorkout(sourceId){

function finishSession(){
  const A = S.active; if(!A) return;
  const ex = A.exercises.map(e => ({...e, sets: e.sets.filter(s => s.done)})).filter(e => e.sets.length);
  if(!ex.length){
    return ask("No sets are ticked yet, so there is nothing to save. Discard this workout?", "Discard", () => { S.active = null; save(); refresh(); });
  }
  const end = Date.now();
  const xpBefore = totalXp(), lvBefore = lvlOf(xpBefore);
  let volume = 0, setsDone = 0;
  const prs = [];
  ex.forEach(e => {
    let top = 0;
    e.sets.forEach(s => { const w = num(s.w), r = num(s.r); volume += w * r; setsDone++; top = Math.max(top, metric(w, r)); });
    const prev = bestFor(e.name);
    if(prev.best > 0 && top > prev.best + 1e-9) prs.push(e.name);
  });
  const log = {
    id: A.id, dayId: A.dayId, title: A.title, start: A.start, end,
    exercises: ex.map(e => ({name: e.name, gif: e.gif, muscle: e.muscle, timed: e.timed, sets: e.sets.map(s => ({w: num(s.w), r: num(s.r)}))})),
    sets: setsDone, volume, prs, xp: 0
  };
  S.logs.push(log);
  const st = streakInfo();
  log.xp = setsDone * 10 + Math.min(150, Math.floor(volume / 200)) + 50 + prs.length * 30 + Math.min(st.cur, 7) * 5;
  const ps = progressStats(), unlocked = [];
  BADGES.forEach(b => { if(!S.badges[b.id] && b.ok(ps)){ S.badges[b.id] = end; unlocked.push(b); } });
  S.active = null;

  if(UI.tab !== "lib") render();

}

async function importJefit(){
  const url = $("#jUrl").value.trim();

    const name = (doc.querySelector("h1")?.textContent || "").trim();

        const t = (n.textContent || "").trim(); if(t) parts.push(t);

    if(!gif){
      const img = [...doc.querySelectorAll("img")].find(i => /view\s*\d/i.test(i.alt || "") || /\/images\/exercises\//i.test(i.getAttribute("src") || ""));
      if(img){
        let src = img.getAttribute("src") || "";
        try{ const p = new URL(src, url); const inner = p.searchParams.get("url"); src = inner ? decodeURIComponent(inner) : p.href; }catch(e){}
        gif = src;
      }
    }
    if(!name && !how && !gif) throw new Error("no exercise details found on that page");
    if(name) $("#f_name").value = name;

    say("#jStatus", "Import failed: " + err.message + ". You can fill the fields in by hand.", "err");
  }
}

/* =========================================================
   Routines: recommended exercises for the muscles you want to focus on

const MUSCLE_ORDER = ["chest","back","shoulders","biceps","triceps","forearms","abs","upper legs","lower legs","glutes","cardio"];
const PRESETS = [
  ["Push", ["chest","shoulders","triceps"]], ["Pull", ["back","biceps","forearms"]], ["Legs", ["upper legs","lower legs","glutes"]],
  ["Upper body", ["chest","back","shoulders","biceps","triceps"]], ["Core", ["abs"]], ["Full body", ["chest","back","upper legs","shoulders","abs"]]

const NOT_WORKOUT = /stretch|foam roll|mobility|warm[- ]?up|knee to chest|knee across|circles|stork|single-leg stance|cat[- ]?cow/i;
const HOME_EQ = new Set(["body weight","bands","dumbbell","kettlebell","exercise ball","pullup bar","weight plate","bench","other","medicine ball","sliders","gymnastic rings","suspension trainer","parallette bars","plyo box","slant board","ab wheel","sandbag"]);
const BW_EQ = new Set(["body weight","pullup bar"]);
const LEVEL_MAX = {Any: 3, Beginner: 1, Intermediate: 2, Advanced: 3};
/* How much each difficulty is preferred for each level choice (index = rank 1..3) */
const LEVEL_FIT = {Any: [0, 1.5, 0.5, -1.5], Beginner: [0, 1.5, -3, -3], Intermediate: [0, 1, 1.5, -1.5], Advanced: [0, 0.5, 1, 1.5]};
/* Common, well-known movements float to the top; exotic ones sink */
const STAPLES = /^(barbell (bench press|incline bench press|squat|deadlift|shoulder press|curl|row|bent-over row|romanian deadlift|hip thrust|military press)|dumbbell (bench press|incline bench press|shoulder press|lateral raise|curl|bicep curl|row|lunge|fly|incline fly|hammer curl|romanian deadlift|goblet squat|tricep extension|rear delt row|calf raise)|pull-up|push-up|dip|plank|crunch|hanging leg raise|reverse crunch|russian twist|bicycle crunch|cable lat pulldown \(wide grip\)|machine lat pulldown|cable seated row|cable rope face pull|cable tricep pushdown \(rope\)|cable bicep curl|cable cross-over|machine fly|leg press|leg extension|leg curl|machine leg press|lying leg curl|standing calf raise|seated calf raise|lunge|bodyweight squat|glute bridge|ez bar curl|ez bar skull crusher|running|walking|rowing|stationary bike|treadmill running|jump rope|elliptical training)$/i;
const EXOTIC = /medicine ball|stability|single-leg|one-leg|jump|throw|plyo|clap|isometric|renegade|spider|zottman|tate|windshield|dragon flag|sissy|behind the back|kneeling jump|deep push-up/i;
const EQ_PREF = {"barbell": 1.5, "dumbbell": 1.5, "strength machine": 1, "pullup bar": 1, "ez curl bar": 1, "bench": 0.5, "body weight": 0.5, "cardio machine": 0.5, "kettlebell": -0.5, "bands": -0.5, "exercise ball": -1.5, "weight plate": -1.5, "other": -1, "medicine ball": -1, "sandbag": -1.5, "landmine": -1, "trap bar": 0, "clubbell": -2, "macebell": -2, "bulgarian bag": -2, "indian club": -2, "battle ropes": -1.5, "tire": -2, "climbing rope": -2, "gravity boots": -2, "sledge hammer": -2, "gymnastic rings": -0.5, "suspension trainer": -0.5, "sliders": -1, "parallette bars": -0.5, "plyo box": -0.5, "slant board": -1};
const diffRank = e => ({easy: 1, medium: 2, difficult: 3}[diffOf(e)] || 2);
function equipMatch(mode, e){
  if(!mode || mode === "All") return true;
  const eq = equipList(e).map(canon);
  if(mode === "home") return eq.every(x => HOME_EQ.has(x));
  if(mode === "bodyweight") return eq.every(x => BW_EQ.has(x));
  return eq.includes(mode);
}
const EQ_WORDS = /\b(barbell|dumbbell|cable|machine|smith|ez|curl bar|bar|kettlebell|bands?|stability|ball|leverage|lever|sled|plate|weighted|assisted|bodyweight|body weight|sliders?|clubbell|macebell|sandbag|rings?|suspension|landmine|parallettes?|superband|miniband|double|medicine|slam|wall|tire|trap)\b/g;
/* Same movement, different equipment (Barbell vs Dumbbell Bench Press) shares a key, so a routine gets variety */
function moveKey(e){
  const k = String(e.name).toLowerCase().replace(/\(.*?\)/g, " ").replace(EQ_WORDS, " ")
    .replace(/\b(one|single|two)[- ](arm|leg)\b|\b(seated|standing|lying|alternating|alternate|wide|close|narrow|reverse|underhand|overhand|neutral|grip)\b/g, " ")
    .replace(/[^a-z]+/g, " ").trim().replace(/\s+/g, " ");
  return k || canon(e.name);
}
function exType(e){
  const ms = muscleKeys(e), n = e.name.toLowerCase(), eq = equipList(e).map(canon);
  if(ms[0] === "cardio" || eq.includes("cardio machine")) return "cardio";
  if(/\b(plank|hold|isometric|wall sit)\b/.test(n) || (e.movement || []).includes("Isometric Hold")) return "timed";
  if(e.mechanics === "Isolation") return "isolation";
  if(/curl|raise|fly|flye|extension|kickback|pullover|shrug|crunch|pushdown|twist|rotation|cross-?over|pec deck|squeeze|wrist/.test(n)) return "isolation";
  if(["abs","forearms","lower legs"].includes(ms[0])) return "isolation";
  if(ms.length >= 3 || (ms.length === 2 && ["chest","back","upper legs","glutes","shoulders"].includes(ms[0]))) return "compound";
  if(/press|row|squat|deadlift|lunge|pull-?up|dip|push-?up|thrust|clean|snatch/.test(n)) return "compound";
  return "isolation";
}
function prescribe(e, type){
  const ms = muscleKeys(e), eq = equipList(e).map(canon);
  if(type === "cardio") return {sets: "1 × 10–20 min", rest: "–"};
  if(type === "timed") return {sets: "3 × 30–60 sec", rest: "45 sec"};
  if(type === "compound") return eq.includes("barbell") ? {sets: "4 × 6–10", rest: "2 min"} : {sets: "3 × 8–12", rest: "90 sec"};
  if(ms[0] === "lower legs") return {sets: "4 × 12–20", rest: "45 sec"};
  if(ms[0] === "abs" || ms[0] === "forearms" || eq.includes("body weight")) return {sets: "3 × 12–20", rest: "45 sec"};
  return {sets: "3 × 10–15", rest: "60 sec"};
}
function jitter(name, seed){
  if(!seed) return 0;
  let h = 2166136261;
  const s = name + "|" + seed;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) / 4294967295 - 0.5) * 5;
}
function scoreEx(e, focus, seed, level){
  const ms = muscleKeys(e);
  const idx = ms.findIndex(m => focus.includes(m));
  if(idx < 0) return null;
  const overlap = ms.filter(m => focus.includes(m)).length;
  let s = (idx === 0 ? 10 : 4) - idx * 0.3 + (overlap - 1) * 2.5;    // primary muscle first, bonus for hitting several focus muscles
  if(e.gif) s += 2;
  if((e.instructions || "").length > 40) s += 1;
  if(exType(e) === "compound") s += 2;
  s += (LEVEL_FIT[level] || LEVEL_FIT.Any)[diffRank(e)];
  const n = e.name;
  if(STAPLES.test(n.trim())) s += 3;
  if(EXOTIC.test(n)) s -= 2.5;
  s -= Math.max(0, n.replace(/\(.*?\)/g, "").trim().split(/\s+/).length - 3) * 0.5;      // shorter names are usually the classic version
  const ep = equipList(e).map(x => EQ_PREF[canon(x)] ?? -1);
  s += Math.min(...ep) <= -1 ? Math.min(...ep) : Math.max(...ep);    // one exotic item (sliders, clubbell…) outweighs the rest
  return s + jitter(n, seed);
}
const groupOf = (e, focus) => muscleKeys(e).find(k => focus.includes(k));
/* Round-robin across the focus muscles so every one gets its share; avoid repeats of the same movement and too much of one equipment */
function pickBalanced(cand, focus, count){
  const groups = focus.map(m => ({m, items: cand.filter(x => groupOf(x.e, focus) === m)}));
  const chosen = [], keys = new Set(), eqN = {}, famN = {};
  const cap = Math.ceil(count / 3) + 1, famCap = Math.ceil(count / 4);   // at most ~a quarter of a routine from one movement family (presses, lunges…)
  const fam = x => x.key.split(" ").pop();
  for(const ps of [{dup: false, cap: true}, {dup: false, cap: false}, {dup: true, cap: false}]){
    let progress = true;
    while(chosen.length < count && progress){
      progress = false;
      for(const g of groups){
        if(chosen.length >= count) break;
        const c = g.items.find(x => !chosen.includes(x) && (ps.dup || !keys.has(x.key)) && (!ps.cap || ((eqN[equipList(x.e)[0]] || 0) < cap && (famN[fam(x)] || 0) < famCap)));
        if(c){ chosen.push(c); keys.add(c.key); const q = equipList(c.e)[0]; eqN[q] = (eqN[q] || 0) + 1; famN[fam(c)] = (famN[fam(c)] || 0) + 1; progress = true; }
      }
    }
    if(chosen.length >= count) break;
  }
  return chosen;
}
const TYPE_RANK = {compound: 0, isolation: 1, timed: 1, cardio: 2};
function toItem(c, focus){
  const type = exType(c.e);
  return {e: c.e, key: c.key, type, rx: prescribe(c.e, type), group: groupOf(c.e, focus)};
}
function buildRoutine(P){
  const focus = P.focus.map(canon), count = P.count, maxRank = LEVEL_MAX[P.level] || 3;
  const res = {list: [], pool: [], out: new Set(), relaxed: "", focus};
  if(!focus.length) return res;
  const stages = [{lv: true, eq: true, note: ""}, {lv: false, eq: true, note: "Not enough matches at that level, so some exercises are from other levels."}, {lv: false, eq: false, note: "Not enough matches for your level and equipment, so I added the best remaining exercises."}];
  const base = libItems().filter(isWorkout);
  for(const st of stages){
    const cand = base.filter(e => (!st.lv || diffRank(e) <= maxRank) && (!st.eq || equipMatch(P.equip, e)))
      .map(e => ({e, s: scoreEx(e, focus, P.seed, P.level), key: moveKey(e)})).filter(x => x.s !== null).sort((a, b) => b.s - a.s);
    const picked = pickBalanced(cand, focus, count);
    res.pool = cand; res.relaxed = st.note;
    res.list = picked.map(c => toItem(c, focus)).sort((a, b) => TYPE_RANK[a.type] - TYPE_RANK[b.type]);
    if(picked.length >= count) break;
  }
  return res;
}
let RT = {key: "", res: null};
function routineResult(){
  const P = S.routine, key = JSON.stringify(P) + "|" + libItems().length;
  if(RT.key !== key) RT = {key, res: buildRoutine(P)};
  return RT.res;
}
function swapRoutine(i){
  const res = routineResult(), cur = res.list[i]; if(!cur) return;
  const focus = res.focus;
  const used = new Set(res.list.map(x => x.e.name)), keys = new Set(res.list.map(x => x.key));
  res.out.add(cur.e.name);
  const ok = x => !used.has(x.e.name) && !res.out.has(x.e.name) && !keys.has(x.key);
  const c = res.pool.find(x => ok(x) && groupOf(x.e, focus) === cur.group) || res.pool.find(ok);
  if(!c){ res.out.delete(cur.e.name); return toast("No more alternatives"); }
  res.list[i] = toItem(c, focus);
}

function parseImport(data){
  if(!data || typeof data !== "object") throw new Error("this isn’t a JSON object");
  let plan = null, hist = null, routinesRaw = null;
  if(data.plan || data.history || data.routines){ plan = data.plan || null; hist = data.history || null; routinesRaw = data.routines || null; }
  else if(Array.isArray(data.days)){ plan = {days: data.days, custom: data.custom}; hist = Array.isArray(data.logs) ? {logs: data.logs, badges: data.badges} : null; }   // older full backups
  const days = plan && Array.isArray(plan.days)
    ? plan.days.filter(d => d && typeof d.title === "string" && Array.isArray(d.exercises))
        .map(d => ({id: uid(), title: d.title, exercises: d.exercises.filter(x => x && x.name).map(x => ({...BLANK_EX, ...x, id: uid()}))})) : null;
  const custom = plan && Array.isArray(plan.custom) ? plan.custom.filter(c => c && c.name) : [];
  const routines = Array.isArray(routinesRaw)
    ? routinesRaw.filter(r => r && typeof r.title === "string" && Array.isArray(r.exercises))
        .map(r => ({id: uid(), title: r.title, exercises: r.exercises.filter(x => x && x.name).map(x => ({...BLANK_EX, ...x, id: uid()}))})) : null;
  const logs = hist && Array.isArray(hist.logs)
    ? hist.logs.filter(l => l && l.id && Array.isArray(l.exercises) && isFinite(l.start) && isFinite(l.end))
        .map(l => ({...l, sets: num(l.sets), volume: num(l.volume), xp: num(l.xp), prs: Array.isArray(l.prs) ? l.prs : []})) : null;
  const badges = hist && hist.badges && typeof hist.badges === "object" ? hist.badges : {};
  if(!(days && days.length) && !(routines && routines.length) && !(logs && logs.length)) throw new Error("no workouts, routines or history found");
  return {days, custom, routines, logs, badges, profile: data.profile && typeof data.profile === "object" ? data.profile : null};
}

function applyImport(p, mode){
  const r = {days: 0, logs: 0, custom: 0, routines: 0};
  if(mode === "replace"){
    if(p.days){ S.days = p.days; S.activeDay = null; S.custom = p.custom; r.days = p.days.length; r.custom = p.custom.length; }
    if(p.routines){ S.routines = p.routines; r.routines = p.routines.length; }
    if(p.logs){ S.logs = p.logs; S.badges = p.badges; r.logs = p.logs.length; }
    if(p.profile) S.profile = Object.assign(S.profile, p.profile);
  }else{
    if(p.days){ S.days.push(...p.days); r.days = p.days.length; }
    if(p.routines){ S.routines.push(...p.routines); r.routines = p.routines.length; }
    const names = new Set(S.custom.map(c => nkey(c.name)));
    p.custom.forEach(c => { if(!names.has(nkey(c.name))){ S.custom.push(c); r.custom++; } });
    if(p.logs){
      const ids = new Set(S.logs.map(l => l.id));
      p.logs.forEach(l => { if(!ids.has(l.id)){ S.logs.push(l); r.logs++; } });
      Object.entries(p.badges).forEach(([k, v]) => { if(!S.badges[k] || v < S.badges[k]) S.badges[k] = v; });
    }
  }
  ensureState(S); save();
  const bits = [r.days && r.days + " workout" + (r.days === 1 ? "" : "s"), r.routines && r.routines + " routine" + (r.routines === 1 ? "" : "s"), r.logs && r.logs + " log" + (r.logs === 1 ? "" : "s"), r.custom && r.custom + " exercise" + (r.custom === 1 ? "" : "s")].filter(Boolean);
  return "Imported " + (bits.join(", ") || "nothing new");
}

document.addEventListener("click", e => {
  if(e.target === scrim) return closeSheet();
  const t = e.target.closest("[data-act]");
  if(t && ACT[t.dataset.act]) ACT[t.dataset.act](t, e);
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeSheet();
  if(e.key === "Enter" && e.target.id === "d_title"){ e.preventDefault(); ACT["save-day"](); return; }
  if((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-act]')){
    e.preventDefault();
    e.target.click();
  }
});
let previewTimer;
document.addEventListener("input", e => {
  const el = e.target, id = el.id;
  if(el.dataset && el.dataset.f && S.active){
    const ex = S.active.exercises[+el.dataset.ei], s = ex && ex.sets[+el.dataset.si];
    if(s){ s[el.dataset.f] = el.value; save(); updateSessionStats(); }
    return;
  }
  if(id === "bTitle"){ S.builder.title = el.value; save(); return; }
  if(el.dataset && el.dataset.bf){
    const x = S.builder.exercises[+el.dataset.bi];
    if(x){ x[el.dataset.bf] = el.value; save(); const s = $("#bSummary"); if(s) s.textContent = draftSummary(); }
    return;
  }
  if(id === "bpSearch"){ BP.q = el.value; renderBuilderPicker(); return; }
  if(id === "f_gif"){ clearTimeout(previewTimer); previewTimer = setTimeout(previewGif, 600); }
  else if(id === "libSearch"){ UI.q = el.value; UI.libLimit = 120; updateLib(); }
  else if(id === "pickSearch"){ renderPicks(); }
  else if(id === "spSearch"){ renderSessPicks(); }
});
document.addEventListener("change", e => {
  const id = e.target.id;
  if(id === "setGoal"){ S.profile.goal = +e.target.value; save(); toast("Weekly goal: " + S.profile.goal); if(UI.tab === "prog") render(); }
  else if(id === "setUnit"){ S.profile.unit = e.target.value; save(); if(UI.tab === "prog") render(); }
  else if(id === "setTheme"){ setTheme(e.target.value); }
  else if(id === "rtLevel"){ S.routine.level = e.target.value; S.routine.seed = 0; save(); renderKeep(); }
  else if(id === "rtEquip"){ S.routine.equip = e.target.value; S.routine.seed = 0; save(); renderKeep(); }
  else if(id === "rtCount"){ S.routine.count = +e.target.value; save(); renderKeep(); }
  else if(id === "impFile"){
    const f = e.target.files && e.target.files[0]; if(!f) return;
    f.text().then(txt => { $("#impText").value = txt; say("#impMsg", "Loaded " + f.name + ". Tap Import to continue.", "ok"); })
      .catch(() => say("#impMsg", "Could not read that file.", "err"));
  }
});
document.addEventListener("focusin", e => { if(e.target.id === "libSearch") document.body.classList.add("kb"); });
document.addEventListener("focusout", e => { if(e.target.id === "libSearch") document.body.classList.remove("kb"); });

function syncTop(){
  const h = $(".top").offsetHeight;
  if(h) document.documentElement.style.setProperty("--top-h", h + "px");
}
if("ResizeObserver" in window) new ResizeObserver(syncTop).observe($(".top"));
window.addEventListener("resize", syncTop);
applyTheme();
S = loadState();
render();
syncTop();
console.log(LIB.length ? `JEFIT library loaded: ${LIB.length} exercises.` : "JEFIT library JS was not loaded. Check that data.js sits next to this file.");
</script>
