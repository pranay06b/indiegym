<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1B2CC1">
<title>Indiegym</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B2CC1'/%3E%3Cg fill='white'%3E%3Crect x='3' y='12' width='3' height='8' rx='1'/%3E%3Crect x='7' y='9' width='3' height='14' rx='1'/%3E%3Crect x='10' y='14.5' width='12' height='3'/%3E%3Crect x='22' y='9' width='3' height='14' rx='1'/%3E%3Crect x='26' y='12' width='3' height='8' rx='1'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --slab:#1B2CC1;      /* ultramarine: identity colour */
  --ink:#101A4A;       /* deep navy text */
  --muted:#565D7E;
  --floor:#E3E5E9;     /* concrete */
  --paper:#FFFFFF;
  --line:#C9CDD6;
  --signal:#FF5B1F;    /* safety orange: attention only */
  --danger:#B3200C;
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --gl:max(16px,env(safe-area-inset-left));   /* left/right gutters, safe-area aware */
  --gr:max(16px,env(safe-area-inset-right));
  --top-h:58px;                                /* header height, kept in sync by JS for sticky bars */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--floor);color:var(--ink);font:16px/1.45 var(--font-body);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button,[data-act]{touch-action:manipulation}
button{-webkit-appearance:none;appearance:none}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Top bar ---------- */
.top{background:var(--slab);color:#fff;position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top)}
.top-in{max-width:1120px;margin:0 auto;padding:8px var(--gr) 8px var(--gl);display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1;letter-spacing:.01em}
.brand svg{width:30px;height:30px;fill:currentColor}
.keychip{border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:0 14px;min-height:38px;font-size:13px;font-weight:600;cursor:pointer}
.keychip.none,.keychip.bad{background:var(--signal);border-color:var(--signal);color:var(--ink)}
.keychip.ok::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#7CF2A6;margin-right:8px}

/* ---------- Tabs (bottom bar on phones, inline on desktop) ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-top:1.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;border:0;background:none;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--slab);box-shadow:inset 0 3px 0 var(--slab)}
.tab:active{background:#F1F2F7}

/* ---------- Layout ---------- */
.banner{max-width:1120px;margin:0 auto;padding:12px var(--gr) 0 var(--gl)}
.banner:empty{display:none}
.keybar{padding:12px 14px;background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.keybar p{font-size:14.5px;line-height:1.35}
.keybar .btn{flex:0 0 auto}
main{max-width:1120px;margin:0 auto;padding:0 var(--gr) 32px var(--gl)}

/* Day rail: sticks under the header so you can switch days from anywhere in the list */
.rail{position:sticky;top:calc(var(--top-h) - 1px);z-index:20;display:flex;gap:8px;overflow-x:auto;margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:12px var(--gr) 10px var(--gl);background:var(--floor);border-bottom:1px solid var(--line);scroll-snap-type:x proximity;scroll-padding-left:var(--gl);scrollbar-width:none}
.rail::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;width:120px;text-align:left;background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;padding:9px 11px 10px;cursor:pointer;scroll-snap-align:start}
.dchip b{display:block;font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1}
.dchip span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.3;color:var(--muted);margin-top:4px;min-height:2.6em}
.dchip.on{background:var(--slab);border-color:var(--slab);color:#fff}
.dchip.on span{color:#DDE1FF}
.dchip.add{background:transparent;border-style:dashed;width:88px}

/* Day header */
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:16px 0 12px}
.day-head > div{min-width:0}
.day-head h2{font-family:var(--font-display);font-weight:800;font-size:clamp(36px,9vw,56px);line-height:.95}
.day-head .meta{color:var(--muted);font-size:14px;margin-top:8px}
.day-head .btn{flex:0 0 auto;margin-top:4px}

/* Exercise rows */
.ex-list{border-top:2px solid var(--ink)}
.ex{display:grid;grid-template-columns:112px 1fr 18px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ex:active{background:rgba(255,255,255,.75)}
.ex .gif{width:112px}
.ex .go{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ex-main{min-width:0}
.ex-main h3{font-size:17px;line-height:1.25;font-weight:700}
.ex-sub{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;margin-top:3px}
.ex-muscle{color:var(--muted);font-size:13px}
.ex-stats{display:flex;gap:18px;margin-top:8px}
.ex-stats b{display:block;font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.05}
.ex-stats span{font-size:12px;color:var(--muted)}
.pips{display:inline-flex;align-items:center;gap:4px}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink)}
.pips i.on{background:var(--ink)}
.pips em{font-style:normal;font-size:12.5px;color:var(--muted);margin-left:5px}
.add-ex{margin-top:18px}

/* GIF slots */
.gif{position:relative;aspect-ratio:1/1;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.gif img{width:100%;height:100%;object-fit:contain;display:block}
.gif.loading{background:linear-gradient(100deg,#fff 30%,#EDEFF5 50%,#fff 70%) 0 0/220% 100%;animation:sheen 1.3s linear infinite}
@keyframes sheen{to{background-position:-220% 0}}
.gif.err,.gif.empty{background:#F3F4F7}
.gif.lg{aspect-ratio:auto;width:100%;height:min(34vh,300px);height:min(34dvh,300px)}
.gif.sm{width:56px;flex:0 0 56px}
.gif-msg{font-size:12px;line-height:1.25;color:var(--muted);padding:0 8px}
.gif-btn{border:1.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:0 12px;min-height:32px;font-size:12px;font-weight:700;cursor:pointer}
.gif:not(.lg) .gif-btn.k{display:none}   /* the banner already says "add key"; keep small slots quiet */
.gif.sm .gif-msg{display:none}
.gif.sm .gif-btn{font-size:10px;padding:0 6px;min-height:22px}

/* Library */
.lib-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:16px 0 8px}
.lib-head h2{font-family:var(--font-display);font-weight:800;font-size:clamp(36px,9vw,52px);line-height:.95}
.lib-head p{color:var(--muted);font-size:14px}
.lib-head .lib-head-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.lib-tools{position:sticky;top:calc(var(--top-h) - 1px);z-index:20;margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:8px var(--gr) 0 var(--gl);background:var(--floor);border-bottom:1px solid var(--line)}
.search input{width:100%;min-height:48px;border:1.5px solid var(--ink);border-radius:8px;padding:0 14px;background:var(--paper);font-size:16px}
.lib-filter-row{display:flex;gap:8px;margin-top:8px;align-items:center}
.lib-filter-row .btn{flex:0 0 auto}
.filter-summary{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.filter-grid label{display:flex;gap:9px;align-items:center;min-height:42px;font-size:14px}
.filter-grid input{width:20px;height:20px;accent-color:var(--slab)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:2px var(--gr) 10px var(--gl);scrollbar-width:none}
.gchip{flex:0 0 auto;min-height:40px;padding:0 15px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font-weight:600;font-size:14px;cursor:pointer}
.gchip.on{background:var(--ink);color:#fff}
.lib-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px;margin-top:14px}
.tile{cursor:pointer;display:flex;flex-direction:column;gap:7px}
.tile:active .gif{border-color:var(--ink)}
.tile .gif{width:100%}
.tile-name{display:block;font-weight:700;font-size:14px;line-height:1.25}
.tile-meta{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.empty{grid-column:1/-1;color:var(--muted);padding:24px 0}

/* Bottom sheets: fixed header and footer, body scrolls, drag down to dismiss */
.scrim{position:fixed;inset:0;background:rgba(16,26,74,.62);display:none;z-index:60;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
.scrim.open{display:flex}
.sheet{background:var(--paper);width:100%;max-width:600px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;overflow:hidden;border-radius:18px 18px 0 0;animation:rise .18s ease-out;outline:none}
@keyframes rise{from{transform:translateY(24px);opacity:.4}}
.grab{flex:0 0 auto;padding:9px 0 3px;touch-action:none;cursor:grab}
.grab::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:4px 18px 12px;touch-action:none}
.sheet-head h3{font-family:var(--font-display);font-weight:800;font-size:32px;line-height:1.02;padding-top:4px}
.x{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);font-size:24px;line-height:1;cursor:pointer}
.sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 18px 20px}
.sheet-foot{flex:0 0 auto;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
.sheet-foot .status{margin:0 0 8px;min-height:0}
.sheet-foot .status:empty{display:none}
.sheet .gif.lg{margin-bottom:12px}
.sheet h4{font-size:15px;font-weight:700;margin:18px 0 6px}
.how{white-space:pre-line;font-size:15.5px;line-height:1.55;max-width:62ch}
.set{padding:16px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0;padding-top:0}
.set h4{margin-top:0}
.danger-zone{margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.danger-zone h4{margin-top:0}
.danger-zone .hint{margin-bottom:12px}

/* Forms and buttons */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;font-size:16px}
.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--slab);outline:none;box-shadow:0 0 0 3px rgba(27,44,193,.18)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;min-width:0;width:auto}
.hint{font-size:13.5px;color:var(--muted)}
.hint a{color:var(--slab);font-weight:600}
.status{font-size:13.5px;margin-top:10px;min-height:1.4em}
.status.ok{color:#0F6B3A}
.status.err{color:var(--danger)}
.btn{min-height:46px;padding:0 18px;border-radius:8px;border:1.5px solid var(--ink);background:var(--paper);font-weight:700;cursor:pointer}
.btn:active{filter:brightness(.94)}
.btn.sm{min-height:44px;padding:0 16px;font-size:14px}
.btn.primary{background:var(--slab);border-color:var(--slab);color:#fff}
.btn.signal{background:var(--signal);border-color:var(--signal);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.wide{width:100%}
.link{background:none;border:0;padding:0 4px;min-height:44px;font-weight:600;font-size:14px;color:var(--slab);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--danger)}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.add-row{display:flex;gap:10px;align-items:stretch}
.add-row select{flex:1;min-width:0;min-height:46px;border:1.5px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;font-size:16px}
.add-row .btn{flex:0 0 auto;white-space:nowrap}
.add-label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
details.jefit{margin:0 0 14px;border:1.5px solid var(--line);border-radius:8px;padding:0 12px}
details.jefit summary{min-height:46px;display:flex;align-items:center;font-weight:600;cursor:pointer}
details.jefit[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details.jefit .keyrow{margin-bottom:0}
details.jefit .hint{margin:8px 0 12px}
.pick-list{border:1.5px solid var(--line);border-radius:8px;margin-top:8px;max-height:270px;overflow:auto}
.pick{display:flex;gap:12px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.pick:last-child{border-bottom:0}
.pick:active,.pick:hover{background:#F3F4F7}
.pick b{display:block;font-size:14.5px}
.pick small{display:block;color:var(--muted);font-size:12.5px}
.preview{display:flex;gap:12px;align-items:center;margin-top:10px}
.preview .gif{width:120px;flex:0 0 120px}
.check{display:flex;gap:12px;align-items:center;min-height:44px;font-size:14.5px}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--slab)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;z-index:80;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* ---------- Phones ---------- */
@media(max-width:819px){
  .keychip{display:none}                    /* the banner and the Settings tab cover this on phones */
  body.kb .tabs{display:none}               /* free the screen while the keyboard is up */
}
@media(min-width:400px){
  .ex{grid-template-columns:128px 1fr 18px}
  .ex .gif{width:128px}
}

/* ---------- Wider screens ---------- */
@media(min-width:620px){
  .lib-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(min-width:820px){
  :root{--gl:max(24px,env(safe-area-inset-left));--gr:max(24px,env(safe-area-inset-right))}
  body{padding-bottom:0}
  main{padding-bottom:56px}
  .top-in{padding-top:12px;padding-bottom:12px}
  .tabs{position:static;display:flex;gap:4px;background:none;border:0;padding:0}
  .tab{flex-direction:row;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;color:#DDE1FF;font-size:14px}
  .tab.on{background:#fff;color:var(--slab);box-shadow:none}
  .tab:active{background:none}
  .tab.settings-tab{display:none}
  .dchip{width:150px}
  .ex-list{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}
  .ex{grid-template-columns:168px 1fr 18px}
  .ex .gif{width:168px}
  .ex:hover{background:rgba(255,255,255,.5)}
  .lib-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px}
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:14px;max-height:88vh;max-height:88dvh}
  .grab{display:none}
  .sheet-head{padding-top:18px}
  .toast{bottom:32px}
}
@media(min-width:1100px){
  .lib-grid{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="11" width="4" height="10" rx="1"/><rect x="6.5" y="8" width="4" height="16" rx="1"/><rect x="10.5" y="14.5" width="11" height="3"/><rect x="21.5" y="8" width="4" height="16" rx="1"/><rect x="26" y="11" width="4" height="10" rx="1"/></svg>
      <span>Indiegym</span>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-act="tab" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>Plan</button>
      <button class="tab" data-act="tab" data-tab="lib"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Library</button>
      <button class="tab settings-tab" data-act="open-settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2.5"/><circle cx="10" cy="12" r="2.5"/><circle cx="18" cy="18" r="2.5"/></svg>Settings</button>
    </nav>
    <button class="keychip" id="keyChip" data-act="open-settings"></button>
  </div>
</header>

<div class="banner" id="banner"></div>
<main id="main"></main>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* =========================================================
   Helpers
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => "x" + Math.random().toString(36).slice(2, 10);
const CDN = "https://cdn.jefit.com/assets/img/exercises/gifs/";
const TEST_GIF = CDN + "2.gif";
const PROXY_BASE = "https://image-cors-proxy.pranay9506k.workers.dev/";
const KEY_STORE = "indiegym_proxy_key";
const STATE_STORE = "indiegym_state_v1";

/* =========================================================
   Exercise library (from the original plan's JEFIT entries)
   [name, muscle, sets, rest, difficulty, JEFIT GIF id, instructions]
   ========================================================= */
const LIB_SEED = [
 ["Barbell Bench Press","Chest","4 × 6–10","2 min","Difficult",2,"Lie flat with feet firmly on the floor and shoulders/back supported by the bench. Grip the bar slightly wider than shoulder width. Unrack over the chest, lower it slowly toward the mid-chest, then press back up while keeping control."],
 ["Incline Dumbbell Press","Chest","4 × 8–12","90 sec","Medium",31,"Set the bench around 30–45°. Hold dumbbells near your upper chest with palms forward. Press them upward until the arms are extended, then slowly bring them back to the sides of the chest."],

}

/* =========================================================
   GIF loading through the image CORS proxy
   fetch -> blob -> saved in IndexedDB -> object URL -> <img>
   ========================================================= */
const proxyUrl = (target, key) => PROXY_BASE + "?url=" + encodeURIComponent(target) + "&key=" + encodeURIComponent(key);

class GifError extends Error{ constructor(kind, msg){ super(msg); this.kind = kind; } }
const GIF = {mem: new Map(), pending: new Map(), dead: new Set(), keyBad: false, coolUntil: 0, active: 0, queue: [], MAX: 4};

function enqueue(task){
  return new Promise((resolve, reject) => { GIF.queue.push({task, resolve, reject}); pump(); });
}
function pump(){
  while(GIF.active < GIF.MAX && GIF.queue.length){
    const j = GIF.queue.shift();
    GIF.active++;
    j.task().then(j.resolve, j.reject).finally(() => { GIF.active--; pump(); });
  }
}

/* IndexedDB cache so each GIF is only fetched through the proxy once */
let dbPromise;
function openDb(){
  if(!dbPromise) dbPromise = new Promise((res, rej) => {
    try{
      const r = indexedDB.open("indiegym", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("gifs");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }catch(e){ rej(e); }
  });
  return dbPromise;
}
const dbReq = (mode, fn) => openDb().then(db => new Promise((res, rej) => {
  const q = fn(db.transaction("gifs", mode).objectStore("gifs"));
  q.onsuccess = () => res(q.result);
  q.onerror = () => rej(q.error);
}));
const dbGet = k => dbReq("readonly", s => s.get(k)).then(v => v || null).catch(() => null);
const dbPut = (k, v) => dbReq("readwrite", s => s.put(v, k)).catch(() => {});
const dbCount = () => dbReq("readonly", s => s.count()).catch(() => 0);
const dbClear = () => dbReq("readwrite", s => s.clear()).catch(() => {});

function remember(url, blob){
  if(GIF.mem.has(url)) return GIF.mem.get(url);
  const o = URL.createObjectURL(blob);
  GIF.mem.set(url, o);
  return o;
}

async function fetchBlob(target, key){
  let res;
  try{ res = await fetch(proxyUrl(target, key)); }
  catch(e){ throw new GifError("network", "Could not reach the image proxy. Check your connection."); }

  if(!res.ok){
    const text = (await res.text().catch(() => "")).trim();
    const snippet = text.slice(0, 140);
    if(res.status === 401 || ((res.status === 402 || res.status === 403) && /key|unauthori[sz]ed/i.test(text))){
      GIF.keyBad = true;
      throw new GifError("key", "The proxy rejected the key.");
    }
    if(res.status === 429){
      GIF.coolUntil = Date.now() + 30000;
      throw new GifError("rate", "The proxy says you have hit a rate limit. Wait a moment, then retry.");
    }
    if(res.status === 404){
      GIF.dead.add(target);
      throw new GifError("missing", "No GIF found at this link (404).");
    }
    throw new GifError("http", "The proxy returned " + res.status + (snippet ? ": " + snippet : "."));
  }

  let blob = await res.blob();
  if(!/^image\//.test(blob.type)){
    const head = await blob.slice(0, 6).text().catch(() => "");
    if(head.startsWith("GIF8")){
      blob = new Blob([blob], {type: "image/gif"});
    }else{
      const text = await blob.text().catch(() => "");
      if(text.length < 500 && /\bkey\b/i.test(text)){ GIF.keyBad = true; throw new GifError("key", "The proxy rejected the key."); }
      throw new GifError("type", "The response was not an image.");
    }
  }
  return blob;
}

function loadGif(url){
  if(GIF.mem.has(url)) return Promise.resolve(GIF.mem.get(url));
  if(GIF.pending.has(url)) return GIF.pending.get(url);
  const p = (async () => {
    const hit = await dbGet(url);
    if(hit) return remember(url, hit);
    if(GIF.dead.has(url)) throw new GifError("missing", "No GIF found at this link.");
    const key = getKey();
    if(!key) throw new GifError("nokey", "Add your proxy key to load GIFs.");
    if(GIF.keyBad) throw new GifError("key", "The proxy rejected the key.");
    if(Date.now() < GIF.coolUntil) throw new GifError("rate", "Rate limit reached. Wait a moment, then retry.");
    const blob = await enqueue(() => fetchBlob(url, key));
    dbPut(url, blob);
    return remember(url, blob);
  })();
  GIF.pending.set(url, p);
  p.then(() => GIF.pending.delete(url), () => GIF.pending.delete(url));
  return p;
}

/* GIF slot: an empty frame that fills with the fetched image */
function gifSlot(url, {size = "md", alt = "", exercise = ""} = {}){
  if(!url) return `<div class="gif ${size} empty"><span class="gif-msg">No GIF</span></div>`;
  return `<div class="gif ${size} loading" data-gif="${esc(url)}" data-alt="${esc(alt)}" data-exercise="${esc(exercise || alt)}"></div>`;
}
function showImg(el, src){
  el.classList.remove("loading", "err");
  el.removeAttribute("title");
  const img = new Image();
  img.alt = (el.dataset.alt || "Exercise") + " demonstration";
  img.decoding = "async";
  img.src = src;
  el.replaceChildren(img);
}
const SHORT = {nokey:"Needs your key", key:"Key rejected", rate:"Rate limited", network:"Can’t reach proxy", missing:"GIF not found", type:"Not an image", http:"Couldn’t load"};
function showErr(el, e){
  const kind = e.kind || "http";
  el.classList.remove("loading");
  el.classList.add("err");
  el.title = e.message;
  const btn = (kind === "nokey" || kind === "key")
    ? `<button class="gif-btn k" type="button" data-act="open-settings">${kind === "nokey" ? "Add key" : "Update key"}</button>`
    : kind === "missing" ? "" : `<button class="gif-btn" type="button" data-act="retry-gif">Retry</button>`;
  el.innerHTML = `<span class="gif-msg">${esc(SHORT[kind] || SHORT.http)}</span>${btn}`;
  if(kind === "key") renderHeader();   // show the "key rejected" banner right away
}
async function startSlot(el){
  const url = el.dataset.gif;
  el.classList.remove("err");
  el.classList.add("loading");
  el.replaceChildren();
  try{
    const src = await loadGif(url);
    if(el.isConnected && el.dataset.gif === url) showImg(el, src);
  }catch(e){
    // A JEFIT exercise can keep an old numeric GIF id even after its
    // exercise record is updated. Re-resolve the exercise from JEFIT once.
    if(e.kind === "missing" && el.dataset.exercise){
      const ex = [...LIB, ...(S?.custom || [])].find(x => String(x.name).toLowerCase() === String(el.dataset.exercise).toLowerCase());
      if(ex && ex.source === "JEFIT" && !el.dataset.repaired){
        el.dataset.repaired = "1";
        await repairJefitExercise(ex);
        if(ex.gif && ex.gif !== url){
          el.dataset.gif = ex.gif;
          el.dataset.alt = ex.name || el.dataset.alt;
          return startSlot(el);
        }
      }
    }
    if(el.isConnected) showErr(el, e);
  }
}
const io = "IntersectionObserver" in window
  ? new IntersectionObserver(entries => entries.forEach(en => {
      if(en.isIntersecting){ io.unobserve(en.target); startSlot(en.target); }
    }), {rootMargin: "300px"})
  : null;
function hydrate(root = document){
  root.querySelectorAll(".gif[data-gif]").forEach(el => {
    if(el.dataset.bound) return;
    el.dataset.bound = "1";
    const url = el.dataset.gif;
    if(GIF.mem.has(url)) return showImg(el, GIF.mem.get(url));
    io ? io.observe(el) : startSlot(el);
  });
}
function retryErrored(){
  document.querySelectorAll(".gif.err[data-gif]").forEach(el => { if(!GIF.dead.has(el.dataset.gif)) startSlot(el); });
}

const EQUIPMENT = ["All","Body Only","Bands","Barbell","Bench","Dumbbell","EZ-Bar","Exercise Ball","Kettlebell","Strength Machine","Pull Bar","Weight Plate","Other"];
const GROUPS = [["All", null], ...MUSCLES.map(m => [m, [m.toLowerCase()]])];
function muscleKeys(e){ return (e.muscles || String(e.muscle || "").split(/[\\/|,]+/)).map(x=>x.trim().toLowerCase()).filter(Boolean); }
function inGroup(e){
  if(UI.group === "All") return true;
  const keys = GROUPS.find(g => g[0] === UI.group)?.[1] || [];
  const ms = muscleKeys(e);
  return keys.some(k => ms.includes(k) || ms.some(m => m.includes(k)));
}
function passesAdvancedFilters(e){
  const ms = muscleKeys(e);
  if(UI.muscles.length){
    const selected = UI.muscles.map(x=>x.toLowerCase());
    const ok = UI.matchAll ? selected.every(m => ms.includes(m) || ms.some(x=>x.includes(m))) : selected.some(m => ms.includes(m) || ms.some(x=>x.includes(m)));
    if(!ok) return false;
  }
  if(UI.difficulty !== "All" && e.difficulty !== UI.difficulty) return false;
  if(UI.equipment !== "All" && e.equipment !== UI.equipment) return false;
  return true;
}
function filterCount(){ return UI.muscles.length + (UI.difficulty !== "All" ? 1 : 0) + (UI.equipment !== "All" ? 1 : 0); }
function filterSummary(){
  const bits=[];
  if(UI.muscles.length) bits.push((UI.matchAll ? "All: " : "") + UI.muscles.join(", "));
  if(UI.difficulty !== "All") bits.push(UI.difficulty);
  if(UI.equipment !== "All") bits.push(UI.equipment);
  return bits.length ? bits.join(" · ") : "No filters applied";
}

function resetSheetMotion(){

  sheetEl.style.transition = "";
  sheetEl.style.animation = "";
}
function openSheet(html){
  sheetEl.innerHTML = html;

  }

function closeSheet(fromPop){
  if(!sheetOpen) return;
  sheetOpen = false;

window.addEventListener("popstate", () => { if(sheetOpen) closeSheet(true); });

/* Swipe down on the handle or title to dismiss */
let drag = null;
sheetEl.addEventListener("pointerdown", e => {
  if(e.pointerType === "mouse" || !e.target.closest(".grab,.sheet-head")) return;
  drag = {y: e.clientY, dy: 0, id: e.pointerId, on: false};
});
sheetEl.addEventListener("pointermove", e => {
  if(!drag || e.pointerId !== drag.id) return;
  const dy = e.clientY - drag.y;
  if(!drag.on && Math.abs(dy) > 6){
    drag.on = true;
    try{ sheetEl.setPointerCapture(e.pointerId); }catch(_){}
    sheetEl.style.animation = "none";
    sheetEl.style.transition = "none";
  }
  if(drag.on){ drag.dy = Math.max(0, dy); sheetEl.style.transform = "translateY(" + drag.dy + "px)"; }
});
function endDrag(e){
  if(!drag || e.pointerId !== drag.id) return;
  const {dy, on} = drag;
  drag = null;
  if(!on) return;
  if(dy > 110) return closeSheet();
  sheetEl.style.transition = "transform .18s ease-out";
  sheetEl.style.transform = "";
  setTimeout(() => { if(sheetOpen) sheetEl.style.transition = ""; }, 220);
}
sheetEl.addEventListener("pointerup", endDrag);
sheetEl.addEventListener("pointercancel", endDrag);

      <div class="ex-sub"><span class="ex-muscle">${esc((ex.muscles || [ex.muscle]).join(" / "))}</span><span class="ex-muscle">${esc(ex.equipment || "Body Only")}</span>${pips(ex.difficulty)}</div>

}

const JEFIT_CACHE_STORE = "indiegym_jefit_cache_v1";
let JEFIT_CACHE = {};
try{ JEFIT_CACHE = JSON.parse(localStorage.getItem(JEFIT_CACHE_STORE) || "{}"); }catch(e){ JEFIT_CACHE = {}; }
function saveJefitCache(){ try{ localStorage.setItem(JEFIT_CACHE_STORE, JSON.stringify(JEFIT_CACHE)); }catch(e){} }
function cachedJefit(name){ return JEFIT_CACHE[String(name).toLowerCase()] || null; }
function applyJefitCache(ex){ const c = cachedJefit(ex.name); if(c) Object.assign(ex,c); return ex; }
const JEFIT_ALIASES = {
  "pec deck / machine fly":"Machine Fly",
  "pec deck (machine fly)":"Machine Fly",
  "cable mid chest crossover + face pull":"Cable Mid Chest Crossover",
  "machine shoulder press":"Machine Shoulder Press",
  "cable one-arm lat pulldown":"Cable One-Arm Lat Pulldown",
  "cable pullover (supine)":"Cable Pullover (Supine)",
  "dumbbell incline curl":"Dumbbell Incline Curl",
  "dumbbell hammer curl":"Dumbbell Hammer Curl",
  "dumbbell bent-over raise":"Dumbbell Bent-Over Raise",
  "cable rope face pull":"Cable Rope Face Pull",
  "cable bicep curl":"Cable Bicep Curl",
  "cable tricep pushdown (rope)":"Cable Tricep Pushdown (Rope)",
  "cable rope overhead tricep extension":"Cable Rope Overhead Tricep Extension",
  "machine assisted dip":"Machine Assisted Dip"
};
function jefitSearchUrl(name){
  const q = JEFIT_ALIASES[String(name).toLowerCase()] || name;
  return "https://www.jefit.com/exercises/bodypart.php?exercises=" + encodeURIComponent(q);
}
async function fetchJefitData(ex){
  const cached = cachedJefit(ex.name); if(cached){ Object.assign(ex,cached); return ex; }
  const key = getKey(); if(!key) throw new Error("Add your proxy key in Settings first.");
  const searchUrl = jefitSearchUrl(ex.name);
  const r = await fetch(proxyUrl(searchUrl,key));
  if(!r.ok) throw new Error("JEFIT search returned " + r.status);
  const html = await r.text();
  const doc = new DOMParser().parseFromString(html,"text/html");
  const links = [...doc.querySelectorAll('a[href*="/exercises/"]')].map(a=>({a,href:a.href,text:(a.textContent||"").replace(/\s+/g," ").trim()}));
  const wanted = ex.name.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  let hit = links.find(x=>x.text.toLowerCase().replace(/[^a-z0-9]+/g," ").trim()===wanted) || links.find(x=>x.text.toLowerCase().includes(wanted));
  if(!hit) throw new Error("Exercise not found in JEFIT database");
  const pageUrl = new URL(hit.href,searchUrl).href;
  const p = await fetch(proxyUrl(pageUrl,key));
  if(!p.ok) throw new Error("JEFIT exercise page returned " + p.status);
  const pdoc = new DOMParser().parseFromString(await p.text(),"text/html");
  const name = (pdoc.querySelector("h1")?.textContent||hit.text||ex.name).trim();
  const ih = [...pdoc.querySelectorAll("h1,h2,h3,h4")].find(h=>/instructions/i.test(h.textContent||""));
  let instructions="";
  if(ih){ const parts=[]; for(let n=ih.nextElementSibling;n && !/^H[1-4]$/i.test(n.tagName);n=n.nextElementSibling){ const t=(n.textContent||"").replace(/\s+/g," ").trim(); if(t) parts.push(t); } instructions=parts.join("\n\n"); }
  const idm=pageUrl.match(/\/exercises\/(\d+)/i);
  const gif=idm ? CDN+idm[1]+".gif" : ex.gif;
  const bodyText=(pdoc.body?.textContent||"").replace(/\s+/g," ");
  const targetMatch=bodyText.match(/Target Muscle Groups\s+Main\s+(.+?)\s+Equipment\s+Main/i);
  const equipMatch=bodyText.match(/Equipment\s+Main\s+(.+?)\s+Difficulty/i);
  const diffMatch=bodyText.match(/Difficulty\s+(beginner|intermediate|expert)/i);
  const muscles=targetMatch ? targetMatch[1].replace(/Main/g," ").trim().split(/(?=[A-Z][a-z])/).map(x=>x.trim()).filter(Boolean) : (ex.muscles||[ex.muscle]);
  const equipment=equipMatch ? equipMatch[1].replace(/Main/g," ").trim().split(/(?=[A-Z][a-z])/).map(x=>x.trim()).filter(Boolean).join(" / ") : ex.equipment;
  const difficulty=diffMatch ? ({beginner:"Easy",intermediate:"Medium",expert:"Difficult"}[diffMatch[1].toLowerCase()]||ex.difficulty) : ex.difficulty;
  const data={name,muscles,muscle:muscles.join(" / "),equipment,difficulty,instructions:instructions||ex.instructions,gif,source:"JEFIT",jefitUrl:pageUrl};
  JEFIT_CACHE[ex.name.toLowerCase()] = data; saveJefitCache(); Object.assign(ex,data); return ex;
}
async function hydrateJefitEntry(ex, rerender=true){
  if(!ex || ex.source!=="JEFIT") return ex;
  const c=cachedJefit(ex.name); if(c){ Object.assign(ex,c); return ex; }
  try{ await fetchJefitData(ex); if(rerender && sheetOpen){ detailSheet(ex,{mode:"lib"}); } }catch(e){ console.warn("JEFIT hydration failed",ex.name,e); }
  return ex;
}

async function importJefit(){
  const url = $("#jUrl").value.trim();
  if(!/^https?:\/\/(www\.)?jefit\.com\//i.test(url)) return say("#jStatus", "That doesn’t look like a jefit.com link.", "err");
  const key = getKey();
  if(!key) return say("#jStatus", "Add your proxy key in Settings first.", "err");
  say("#jStatus", "Fetching from JEFIT…");
  try{
    const res = await fetch(proxyUrl(url, key));
    if(!res.ok) throw new Error("the proxy returned " + res.status);
    const doc = new DOMParser().parseFromString(await res.text(), "text/html");
    const name = (doc.querySelector("h1")?.textContent || "").trim();

    let how = "";
    const ih = [...doc.querySelectorAll("h1,h2,h3,h4")].find(h => /instructions/i.test(h.textContent || ""));
    if(ih){
      const parts = [];
      for(let n = ih.nextElementSibling; n && !/^H[1-4]$/i.test(n.tagName); n = n.nextElementSibling){
        const t = (n.textContent || "").trim();
        if(t) parts.push(t);
      }
      how = parts.join("\n\n");
    }

    let gif = "";
    const idm = url.match(/\/exercises\/(\d+)/i);          // JEFIT GIFs are named after the exercise id
    if(idm) gif = CDN + idm[1] + ".gif";
    if(!gif){
      const img = [...doc.querySelectorAll("img")].find(i => /view\s*\d/i.test(i.alt || "") || /\/images\/exercises\//i.test(i.getAttribute("src") || ""));
      if(img){
        let src = img.getAttribute("src") || "";
        try{ const p = new URL(src, url); const inner = p.searchParams.get("url"); src = inner ? decodeURIComponent(inner) : p.href; }catch(e){}
        gif = src;
      }
    }
    if(!name && !how && !gif) throw new Error("no exercise details found on that page");
    if(name) $("#f_name").value = name;
    if(how) $("#f_how").value = how;
    if(gif){ $("#f_gif").value = gif; previewGif(); }
    if(name) { JEFIT_CACHE[name.toLowerCase()] = {name, instructions:how || "", gif:gif || "", source:"JEFIT", jefitUrl:url}; saveJefitCache(); }
    say("#jStatus", "Filled in " + [name && "the name", how && "instructions", gif && "the GIF"].filter(Boolean).join(", ") + ". Check the fields, then set your sets and rest.", "ok");
  }catch(err){
    say("#jStatus", "Import failed: " + err.message + ". You can fill the fields in by hand.", "err");
  }
}

      say("#keyStatus", e.kind === "key"
        ? "The proxy rejected this key. Check it and paste it again."
        : e.message + " Your key is saved. Try again in a moment.", "err");
      retryErrored();   // slots that said "Needs your key" now show the real reason
    }
    renderHeader();
    dbCount().then(n => { const c = $("#cacheInfo"); if(c) c.textContent = cacheText(n); });
  },
  "remove-key"(){
    setKey(""); GIF.keyBad = false;
    renderHeader();
    $("#keyInput").value = "";
    say("#keyStatus", "Key removed. GIFs you have already viewed still show from this device.", "ok");
  },
  async "clear-cache"(){
    await dbClear();
    GIF.mem.clear(); GIF.dead.clear();
    const c = $("#cacheInfo"); if(c) c.textContent = cacheText(0);
  },
  "reset-plan"(){
    ask("Reset to the original 6-day plan? Your changes to days and exercises will be discarded.", "Reset plan", () => {
      const d = buildDefault();
      S.days = d.days; S.activeDay = d.activeDay;
      save(); refresh(); toast("Plan reset");
    });
  }
};

document.addEventListener("click", e => {
  if(e.target === scrim) return closeSheet();
  const t = e.target.closest("[data-act]");
  if(t && ACT[t.dataset.act]) ACT[t.dataset.act](t, e);
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeSheet();
  if(e.key === "Enter" && e.target.id === "d_title"){ e.preventDefault(); ACT["save-day"](); return; }
  if((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-act]')){
    e.preventDefault();
    e.target.click();
  }
});
let previewTimer;
document.addEventListener("input", e => {
  const id = e.target.id;
  if(id === "f_gif"){ clearTimeout(previewTimer); previewTimer = setTimeout(previewGif, 600); }
  else if(id === "libSearch"){ UI.q = e.target.value; updateLib(); }
  else if(id === "pickSearch"){ renderPicks(); }
});
/* Hide the bottom tab bar while the library search has the keyboard open */
document.addEventListener("focusin", e => { if(e.target.id === "libSearch") document.body.classList.add("kb"); });
document.addEventListener("focusout", e => { if(e.target.id === "libSearch") document.body.classList.remove("kb"); });

/* =========================================================
   Start
   ========================================================= */
function syncTop(){
  const h = $(".top").offsetHeight;
  if(h) document.documentElement.style.setProperty("--top-h", h + "px");
}
if("ResizeObserver" in window) new ResizeObserver(syncTop).observe($(".top"));
window.addEventListener("resize", syncTop);
S = loadState();
render();
syncTop();
</script>
</body>
